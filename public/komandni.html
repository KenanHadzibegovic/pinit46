<style>
/* Isti vizuelni jezik kao platforma (PRD 7.3). Skala stanja kolovoza
   (zelena → žuta → narandžasta → crvena) je jedino mjesto gdje se boje

:root{--bg:#161a18;--panel:#1e2422;--panel2:#232a28;--line:#2b3330;--line2:#353e3b;--tx:#eaefec;--tx2:#b9c2be;--tx3:#8f9a96;--tx4:#66716d;

  --fn:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;--r:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"tnum" 1}

:focus-visible{outline:2px solid var(--green-t);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#2f3835;border-radius:6px;border:2px solid var(--bg)}
.app{display:grid;grid-template-columns:248px 1fr;height:100vh}
body.embed .app{grid-template-columns:1fr}
body.embed .side{display:none}
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.brand{padding:22px 20px 6px;display:flex;align-items:baseline;gap:8px}
.brand img{height:22px}
.brand span{font-size:13px;color:var(--tx3);font-weight:500}
.city{padding:0 20px 18px;font-size:12px;color:var(--tx4);letter-spacing:.06em;text-transform:uppercase}
.nav{flex:1;overflow-y:auto}
.nav button{display:flex;width:100%;text-align:left;padding:11px 20px 11px 22px;font-size:15px;color:var(--tx2);position:relative}

.nav button.on{color:var(--tx);font-weight:600;background:rgba(255,255,255,.035)}
.nav button.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--green);border-radius:0 3px 3px 0}
.nav .cnt{margin-left:auto;font-size:12.5px;color:var(--red);font-weight:600}
.foot{border-top:1px solid var(--line);padding:14px 20px;font-size:12.5px;color:var(--tx3)}
.foot a{color:var(--tx2)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{min-height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 24px;flex-wrap:wrap}

body.embed .top h1{display:none}

.maplibregl-popup-content{background:var(--panel)!important;color:var(--tx)!important;border:1px solid var(--line2);border-radius:10px!important;font-family:var(--fn);font-size:13px;padding:10px 12px!important}

.bands i{display:block;height:100%}
.bl{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--tx2)}
.bl span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.chartbox{position:relative;height:250px}
.chartbox.sm{height:190px}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--panel);border-left:1px solid var(--line2);box-shadow:-24px 0 60px rgba(0,0,0,.45);transform:translateX(104%);transition:transform .22s ease;z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px}

.x{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--tx3)}
.x:hover{background:var(--panel2);color:var(--tx)}
.dr-b{flex:1;overflow-y:auto;padding:18px 20px}
.dr-f{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:8px;flex-wrap:wrap}
.sec{margin-bottom:22px}
.sec h4{font-size:12px;font-weight:500;color:var(--tx3);margin-bottom:9px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;color:var(--tx3);margin-bottom:6px}
.fld input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;font-size:14px;outline:none}

.frow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:7px;border:1px solid var(--line2);color:var(--tx2);white-space:nowrap}
.chip.red{border-color:rgba(240,87,75,.5);color:var(--red)}
.chip.green{border-color:rgba(76,194,106,.5);color:var(--green-t)}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,140px);background:#2a3230;border:1px solid var(--line2);padding:12px 18px;border-radius:12px;font-size:14px;z-index:130;transition:transform .25s;max-width:90vw}
.toast.on{transform:translate(-50%,0)}
.toast.err{border-color:rgba(240,87,75,.6)}
input.inp,select.inp{background:var(--bg);color:var(--tx);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font-size:14px;outline:none}

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   PINIT DRIVE — komandni centar za cestovnu mrežu (PRD 13.4)

   Iz vožnji (telefon u vozilu mjeri vibracije) sistem gradi DIONICE od
   oko 100 m. Svaka vožnja preko iste dionice je još jedno mjerenje — tako
   se vidi propadanje kroz vrijeme. Nema izmišljenih podataka: bez vožnji
   ekran objašnjava odakle podaci dolaze.
   ════════════════════════════════════════════════════════════════════ */
function esc(v){ if (v == null) return ''; return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
const $ = id => document.getElementById(id);
const DAY = 864e5;
const S = { D: [], P: null, view: 'mreza', dion: [], hot: [], sort: { k: 'q', d: 1 }, q: '', sel: null, drive: null };
let MAP = null, mapMarkers = [];

async function api(path, opt){
  opt = opt || {};
  let r; try { r = await fetch(path, { method: opt.method || 'GET', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: opt.body ? JSON.stringify(opt.body) : undefined }); }
  catch (e) { throw new Error('Nema veze sa serverom.'); }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (r.status === 401) { (window.EMBED ? window.top : window).location.href = '/platforma'; throw new Error('Sesija je istekla.'); }
  if (!r.ok) throw new Error((j && j.error) || (r.status === 404 ? 'Server ne poznaje ' + path + ' — server je vjerovatno starija verzija.' : 'Server je odgovorio greškom ' + r.status + ' na ' + path + '.'));
  return j;
}
let tT; function toast(m, k){ const t = $('toast'); t.textContent = m; t.className = 'toast on' + (k ? ' ' + k : ''); clearTimeout(tT); tT = setTimeout(() => t.className = 'toast', 3200); }
function dateS(t){ const d = new Date(t); return d.getDate() + '. ' + (d.getMonth() + 1) + '. ' + d.getFullYear() + '.'; }
function kada(t){ if (!t) return '—'; const d = Math.floor((Date.now() - t) / DAY); return d <= 0 ? 'danas' : d === 1 ? 'jučer' : 'prije ' + d + ' dana'; }
const fmt = (x, n) => x == null ? '—' : Number(x).toLocaleString('hr-HR', { maximumFractionDigits: n || 0 });

/* ── Skala glatkoće (0–100) i procjena IRI (m/km), ista kao u aplikaciji ── */
const iriOf = q => +((100 - q) * 0.12).toFixed(1);
const qOfIri = iri => Math.max(0, Math.round(100 - iri / 0.12));
function DP(){ return (S.P && S.P.drive) || { prag: 50, sirinaM: 7, krpljenje: 12, presvlacenje: 38, rekonstrukcija: 95, budzet: 150000 }; }
function band(q){ const p = DP().prag;
  return q < p ? { k: 'ispod', n: 'ispod praga', c: '#f0574b' } : q < 60 ? { k: 'slaba', n: 'slaba', c: '#e8883c' } : q < 75 ? { k: 'osrednja', n: 'osrednja', c: '#e0a93b' } : { k: 'dobra', n: 'dobra', c: '#4cc26a' }; }

/* ════════════════════════════════════════════════════════════════════
   DIONICE: mreža polja od ~100 m. Vrijednost dionice u jednom prolazu je
   prosjek segmenata te vožnje u polju. Mjerenja ispod 20 km/h se ne
   računaju (telefon tada ne mjeri pouzdano).
   ════════════════════════════════════════════════════════════════════ */
const CELL_LAT = 0.0009, CELL_LNG = 0.00125;
function usable(s){ return s && typeof s.lat === 'number' && typeof s.lng === 'number' && !s.slow && !(typeof s.v === 'number' && s.v < 20) && (typeof s.q === 'number' || typeof s.iri === 'number'); }
function qOf(s){ return typeof s.q === 'number' ? s.q : qOfIri(s.iri); }
function build(){
  const C = {};
  S.D.forEach(d => {
    const segs = ((d.drive && d.drive.segments) || []).filter(usable);
    const per = {};
    segs.forEach(s => { const k = Math.floor(s.lat / CELL_LAT) + ':' + Math.floor(s.lng / CELL_LNG); (per[k] = per[k] || []).push(s); });
    Object.keys(per).forEach(k => { const L = per[k]; const c = C[k] = C[k] || { k, lat: 0, lng: 0, n: 0, passes: [] };
      L.forEach(s => { c.lat += s.lat; c.lng += s.lng; c.n++; });
      c.passes.push({ ts: d.ts, id: d.id, veh: vehOf(d), q: L.reduce((a, s) => a + qOf(s), 0) / L.length, m: L.length });
      /* Ako mjerenje nosi naziv ulice (npr. iz navigacije vozila), koristi se. */
      L.forEach(s => { if (s.ul) { c.ul = c.ul || {}; c.ul[s.ul] = (c.ul[s.ul] || 0) + 1; } }); });
  });
  S.dion = Object.values(C).map(c => {
    c.lat /= c.n; c.lng /= c.n; c.passes.sort((a, b) => a.ts - b.ts);
    const last = c.passes[c.passes.length - 1];
    c.q = Math.round(last.q); c.iri = iriOf(c.q); c.lastTs = last.ts; c.np = c.passes.length;
    /* Pouzdanost po broju prolaza: jedan prolaz je jedna vožnja, jedan telefon. */
    c.rel = c.np >= 4 ? 'visoka' : c.np >= 2 ? 'srednja' : 'niska';
    /* Propadanje: nagib prave kroz prolaze (glatkoća po mjesecu). Traži bar
       dva prolaza razmaknuta 14 dana — inače je to šum, ne trend. */
    const span = (last.ts - c.passes[0].ts) / DAY;
    if (c.np >= 2 && span >= 14) {
      const xs = c.passes.map(p => (p.ts - c.passes[0].ts) / DAY), ys = c.passes.map(p => p.q);
      const mx = xs.reduce((a, x) => a + x, 0) / xs.length, my = ys.reduce((a, y) => a + y, 0) / ys.length;
      const num = xs.reduce((a, x, i) => a + (x - mx) * (ys[i] - my), 0), den = xs.reduce((a, x) => a + (x - mx) * (x - mx), 0);
      c.slope = den ? num / den * 30 : 0; c.span = span;
    } else c.slope = null;
    if (c.ul && !IMENA[key(c)]) IMENA[key(c)] = Object.keys(c.ul).sort((a, b) => c.ul[b] - c.ul[a])[0];
    c.name = IMENA[key(c)] || ('Dionica kod ' + c.lat.toFixed(4) + ', ' + c.lng.toFixed(4));
    return c;
  });
  numberStreets();
  /* Udari: grupe unutar ~30 m. Potvrđeno kad ih je zabilježilo više vožnji. */
  const H = [];
  S.D.forEach(d => ((d.drive && d.drive.bumps) || []).forEach(b => {
    if (typeof b.lat !== 'number') return;
    let h = H.find(x => Math.abs(x.lat - b.lat) < 0.00027 && Math.abs(x.lng - b.lng) < 0.00037);
    if (!h) { h = { lat: b.lat, lng: b.lng, B: [], drives: new Set() }; H.push(h); }
    h.B.push(b); h.drives.add(d.id); h.lastTs = Math.max(h.lastTs || 0, d.ts);
  }));
  S.hot = H.map(h => { const cls = {}; h.B.forEach(b => { const c = klasa(b.cls); cls[c] = (cls[c] || 0) + 1; });
    const top = Object.keys(cls).sort((a, b) => cls[b] - cls[a])[0];
    return { lat: h.lat, lng: h.lng, n: h.B.length, nd: h.drives.size, cls: top, clsN: cls, peak: Math.max(...h.B.map(b => b.peak || 0)), lastTs: h.lastTs }; })
    .sort((a, b) => (b.cls === 'rupa') - (a.cls === 'rupa') || b.nd - a.nd || b.n - a.n);
}
/* Rupa ili prepreka (PRD 13.4): kod rupe točak prvo propadne pa skoči,
   kod ležećeg policajca se prvo podigne. Klasu određuje aplikacija. */
function klasa(c){ c = String(c || '').toLowerCase(); if (c === 'prag' || c === 'lezeci' || c === 'prepreka') return 'prepreka'; if (c === 'sahta' || c === 'šahta') return 'sahta'; if (c === 'rupa') return 'rupa'; return 'neodređeno'; }
const KLASA_N = { rupa: 'Rupa', prepreka: 'Prepreka (ležeći policajac)', sahta: 'Poklopac šahta', 'neodređeno': 'Neodređeno' };
function vehOf(d){ return String(d.name || '').split(' · ')[0] || 'Vozilo'; }
const key = c => c.lat.toFixed(4) + ',' + c.lng.toFixed(4);
/* Ulica umjesto koordinata: MapTiler, zapamćeno u pregledniku. Više
   dionica iste ulice dobija redni broj („Zmaja od Bosne, dionica 3"). */
const IMENA = (function(){ try { return JSON.parse(localStorage.getItem('pinit_dionice')) || {}; } catch (e) { return {}; } })();
function numberStreets(){
  const by = {};
  S.dion.forEach(c => { const n = IMENA[key(c)]; if (n) (by[n] = by[n] || []).push(c); });
  Object.keys(by).forEach(n => { const L = by[n]; if (L.length === 1) { L[0].name = n; return; }
    L.sort((a, b) => a.lng - b.lng || a.lat - b.lat).forEach((c, i) => c.name = n + ', dionica ' + (i + 1)); });
}
let geoBusy = false;
function nameQueue(list){
  if (geoBusy || !window.PINIT_MAPS || !PINIT_MAPS.reverse) return;
  const todo = list.filter(c => !IMENA[key(c)]).slice(0, 12); if (!todo.length) return;
  geoBusy = true;
  Promise.all(todo.map(c => PINIT_MAPS.reverse(c.lat, c.lng).then(a => { if (a) IMENA[key(c)] = String(a).replace(/\s+\d+[a-zA-Z]?$/, ''); })))
    .then(() => { geoBusy = false; try { localStorage.setItem('pinit_dionice', JSON.stringify(IMENA)); } catch (e) {}
      if (todo.some(c => IMENA[key(c)])) { build(); render(true); } });
}

const NOTE = '<div class="note warn"><b>NAPOMENA</b><span>Tačnost mjerenja još nije potvrđena referentnim uređajem. Ocjena služi za poređenje dionica i redoslijed pregleda, ne kao geodetski podatak.</span></div>';
function qCell(q){ const b = band(q); return '<span class="q" style="color:' + b.c + '">' + q + '</span><div class="qbar"><i style="width:' + q + '%;background:' + b.c + '"></i></div>'; }
function trendTxt(c){ if (c.slope == null) return '<span class="mut">—</span>';
  const s = c.slope; if (Math.abs(s) < 0.5) return '<span class="mut">stabilno</span>';
  return s < 0 ? '<span style="color:var(--red)">' + s.toFixed(1).replace('.', ',') + '/mj</span>' : '<span style="color:var(--green-t)">+' + s.toFixed(1).replace('.', ',') + '/mj</span>'; }
function initMap(el, cb){
  try {
    const ds = S.dion.length ? S.dion : [];
    const c = ds.length ? { lat: ds.reduce((a, x) => a + x.lat, 0) / ds.length, lng: ds.reduce((a, x) => a + x.lng, 0) / ds.length } : {};
    MAP = PINIT_MAPS.init(el, Object.assign({ dark: true, freeRoam: true, zoom: 13 }, c));
    if (!MAP) throw 0;
    let done = false; MAP.on('load', () => { if (!done) { done = true; cb(true); } }); MAP.on('style.load', () => { if (done) cb(false); });
  } catch (e) { const m = $(el); if (m) m.innerHTML = '<div class="mapfail">Karta se nije učitala. Spisak dionica je ispod.</div>'; }
}
function fit(pts){ if (!MAP || !pts.length) return; const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  try { MAP.fitBounds([[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]], { padding: 60, maxZoom: 16, duration: 0 }); } catch (e) {} }
function drawDion(list, first){
  if (!MAP || !MAP.isStyleLoaded()) { if (MAP) MAP.once('idle', () => drawDion(list, first)); return; }
  const fc = { type: 'FeatureCollection', features: list.map((c, i) => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [c.lng, c.lat] }, properties: { i, c: band(c.q).c } })) };
  if (MAP.getSource('d')) MAP.getSource('d').setData(fc); else MAP.addSource('d', { type: 'geojson', data: fc });
  if (!MAP.getLayer('d')) {
    MAP.addLayer({ id: 'd', type: 'circle', source: 'd', paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 11, 3, 16, 9], 'circle-color': ['get', 'c'], 'circle-stroke-color': '#161a18', 'circle-stroke-width': 1 } });
    MAP.on('click', 'd', e => { const f = e.features && e.features[0]; if (f) openDion(list[f.properties.i]); });
    MAP.on('mouseenter', 'd', () => MAP.getCanvas().style.cursor = 'pointer'); MAP.on('mouseleave', 'd', () => MAP.getCanvas().style.cursor = '');

/* ════════════════════════════════════════════════════════════════════
   2. DIONICE — sve, sortirano i pretraživo
   ════════════════════════════════════════════════════════════════════ */
R.dionice = function(){
  const q = S.q.toLowerCase();
  const L = S.dion.filter(c => !q || c.name.toLowerCase().indexOf(q) >= 0);
  const k = S.sort.k, d = S.sort.d;
  L.sort((a, b) => { const va = k === 'name' ? a.name : k === 'slope' ? (a.slope == null ? 99 : a.slope) : a[k], vb = k === 'name' ? b.name : k === 'slope' ? (b.slope == null ? 99 : b.slope) : b[k];
    return (va > vb ? 1 : va < vb ? -1 : 0) * d; });
  const th = (key, t, r) => '<th data-s="' + key + '"' + (r ? ' class="r"' : '') + '>' + t + (S.sort.k === key ? (S.sort.d > 0 ? ' ↑' : ' ↓') : '') + '</th>';
  $('topact').innerHTML = '<input class="inp" id="q" placeholder="Traži ulicu" value="' + esc(S.q) + '" style="width:220px"><button class="btn" onclick="exportDion()">Preuzmi (CSV)</button><button class="btn" onclick="$(\'file\').click()">Učitaj vožnju</button>';
  $('q').oninput = e => { S.q = e.target.value; clearTimeout(window._qt); window._qt = setTimeout(() => { R.dionice(); const n = $('q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); }, 200); };
  $('view').innerHTML = '<div class="card"><div class="tblwrap"><table class="tbl"><thead><tr>' + th('name', 'Dionica') + th('q', 'Glatkoća') + th('iri', 'IRI (m/km)', 1) + th('np', 'Prolaza', 1) +

    (L.length ? L.slice(0, 500).map((c, i) => '<tr data-i="' + i + '"><td>' + esc(c.name) + '</td><td>' + qCell(c.q) + '</td><td class="r">' + String(c.iri).replace('.', ',') + '</td><td class="r">' + c.np + '</td><td><span class="chip' + (c.rel === 'visoka' ? ' green' : '') + '">' + c.rel + '</span></td><td>' + trendTxt(c) + '</td><td class="mut">' + kada(c.lastTs) + '</td></tr>').join('')
      : '<tr><td colspan="7"><div class="empty">Nijedna dionica ne odgovara pretrazi.</div></td></tr>') + '</tbody></table></div></div>' +
    '<p style="color:var(--tx3);font-size:12.5px;margin-top:10px;line-height:1.55">Dionica je polje od oko 100 m. Pouzdanost raste s brojem prolaza: jedan prolaz je jedna vožnja, jedan telefon. Promjena je nagib kroz sve prolaze, računa se kad su bar dva prolaza razmaknuta 14 dana.</p>';
  document.querySelectorAll('th[data-s]').forEach(t => t.onclick = () => { const kk = t.dataset.s; S.sort = { k: kk, d: S.sort.k === kk ? -S.sort.d : 1 }; R.dionice(); });
  document.querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = () => openDion(L[+tr.dataset.i]));
  nameQueue(L.slice(0, 40));
};
function exportDion(){
  csv('dionice.csv', [['Dionica', 'Glatkoća', 'IRI m/km', 'Prolaza', 'Pouzdanost', 'Promjena po mjesecu', 'Posljednje mjerenje', 'GPS']].concat(
    S.dion.slice().sort((a, b) => a.q - b.q).map(c => [c.name, c.q, c.iri, c.np, c.rel, c.slope == null ? '' : c.slope.toFixed(1), dateS(c.lastTs), c.lat.toFixed(5) + ' ' + c.lng.toFixed(5)])));
}
function csv(name, rows){
  const t = '\ufeff' + rows.map(r => r.map(v => { v = v == null ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click(); toast('Preuzeto: ' + name);
}

      note: 'PINIT Drive: ' + name + (q != null ? ' · glatkoća ' + q + '/100, procijenjeni IRI ' + iriOf(q) + ' m/km' : '') + '. Potreban pregled na terenu.' } });

/* ════════════════════════════════════════════════════════════════════
   3. PROPADANJE — ista dionica kroz vrijeme (PRD 13.4)
   ════════════════════════════════════════════════════════════════════ */
R.propadanje = function(){
  const T = S.dion.filter(c => c.slope != null);
  const drop = T.filter(c => c.slope <= -0.5).sort((a, b) => a.slope - b.slope);
  /* Mjesečni prosjek mreže: svaki segment svake vožnje u tom mjesecu. */
  const M = {};
  S.D.forEach(d => { const dt = new Date(d.ts), k = dt.getFullYear() * 12 + dt.getMonth();
    ((d.drive && d.drive.segments) || []).filter(usable).forEach(s => { (M[k] = M[k] || []).push(qOf(s)); }); });
  const mk = Object.keys(M).map(Number).sort((a, b) => a - b);
  const MN = ['jan','feb','mar','apr','maj','jun','jul','avg','sep','okt','nov','dec'];
  /* Kad pada ispod praga: linearna projekcija od sadašnje vrijednosti. */
  const eta = c => c.q < DP().prag ? 'već ispod' : c.slope < 0 ? Math.max(1, Math.round((c.q - DP().prag) / -c.slope)) + ' mj.' : '—';
  $('view').innerHTML = '<div class="stack"><div class="grid g3"><div class="card kpi"><span>Dionica s trendom</span><b>' + T.length + '</b><em>bar 2 prolaza razmaknuta 14 dana</em></div>' +

/* ════════════════════════════════════════════════════════════════════

/* Učitavanje fajla vožnje (GeoJSON ili CSV koje pravi aplikacija) —

function parseDrive(name, text){

    if (gj.properties && gj.properties.gps != null) d.gps = !!gj.properties.gps;
    (gj.features || []).forEach(ft => { const p = ft.properties || {}, g = ft.geometry, ll = g && g.coordinates ? { lng: g.coordinates[0], lat: g.coordinates[1] } : {};
      if (p.vrsta === 'segment_100m') d.segments.push({ iri: p.iri_m_km != null ? p.iri_m_km : iriOf(p.glatkoca), q: p.glatkoca, lat: ll.lat, lng: ll.lng, t: p.vrijeme_s || 0 });
      else if (p.vrsta === 'udar') d.bumps.push({ peak: p.vrh_ms2 || 0, sev: p.jacina || '', lat: ll.lat, lng: ll.lng, t: p.vrijeme_s || 0, cls: p.klasa || null });
      else if (p.vrsta === 'rucna_oznaka') d.taps.push({ tip: p.tip || '', lat: ll.lat, lng: ll.lng, t: p.vrijeme_s || 0 }); });
  } else {
    const lines = t.split(/\r?\n/).filter(Boolean), head = lines[0].split(','), ix = n => head.indexOf(n);
    for (let i = 1; i < lines.length; i++) { const c = lines[i].split(','), v = c[ix('vrsta')], lat = parseFloat(c[ix('lat')]) || null, lng = parseFloat(c[ix('lng')]) || null, tt = parseFloat(c[ix('vrijeme_s')]) || 0;
      if (v === 'segment_100m') d.segments.push({ iri: parseFloat(c[ix('iri_m_km')]) || iriOf(+c[ix('vrijednost')]), q: +c[ix('vrijednost')], lat, lng, t: tt });
      else if (v === 'udar') d.bumps.push({ peak: parseFloat(c[ix('vrijednost')]) || 0, sev: c[ix('tip_ili_jacina')], lat, lng, t: tt, cls: ix('klasa') > -1 ? c[ix('klasa')] || null : null }); }
  }
  if (!d.segments.length && !d.bumps.length) return null;

/* ════════════════════════════════════════════════════════════════════
   MJESEČNI IZVJEŠTAJ — stanje cesta u izabranom mjesecu, iz vožnji tog
   mjeseca, uz poređenje s prethodnim. Za upravu i planiranje sanacije.
   ════════════════════════════════════════════════════════════════════ */
const MJ = ['januar','februar','mart','april','maj','juni','juli','august','septembar','oktobar','novembar','decembar'];
function mjRange(y, m){ return [new Date(y, m, 1).getTime(), new Date(y, m + 1, 1).getTime()]; }
function mjDrive(y, m){
  const [a, b] = mjRange(y, m), pm = new Date(y, m - 1, 1), [pa, pb] = mjRange(pm.getFullYear(), pm.getMonth());
  const M = S.D.filter(d => d.ts >= a && d.ts < b), PM = S.D.filter(d => d.ts >= pa && d.ts < pb);
  const avgQ = L => { const q = []; L.forEach(d => ((d.drive && d.drive.segments) || []).filter(usable).forEach(x => q.push(qOf(x)))); return q.length ? Math.round(q.reduce((x, y) => x + y, 0) / q.length) : null; };
  const prag = DP().prag;
  /* dionice izmjerene u mjesecu: vrijednost iz posljednjeg prolaza u mjesecu i posljednjeg prije */
  const mj = S.dion.map(c => { const u = c.passes.filter(p => p.ts >= a && p.ts < b); if (!u.length) return null;
    const pr = c.passes.filter(p => p.ts < a); return { c, q: Math.round(u[u.length - 1].q), prev: pr.length ? Math.round(pr[pr.length - 1].q) : null }; }).filter(Boolean);
  const nove = mj.filter(x => x.q < prag && x.prev != null && x.prev >= prag);
  const byV = {}; M.forEach(d => { const v = vehOf(d); byV[v] = (byV[v] || 0) + ((d.drive && d.drive.km) || d.pathKm || 0); });
  const rupe = S.hot.filter(h => h.cls === 'rupa' && h.lastTs >= a && h.lastTs < b);

    mj, nove, ispod: mj.filter(x => x.q < prag).length, byV, rupe, worst: mj.slice().sort((x, y) => x.q - y.q).slice(0, 10) };
}
R.izvjestaj = function(){

  const opts = []; for (let i = 0; i < 13; i++) { const d = new Date(n.getFullYear(), n.getMonth() - i, 1); opts.push([d.getFullYear(), d.getMonth(), i === 0]); }
  const cmp = (a, b, unit) => a == null || b == null ? '' : '<em>' + (a === b ? 'isto kao prethodni mjesec' : (a > b ? '+' : '−') + fmt(Math.abs(a - b), 1) + (unit || '') + ' naspram prethodnog') + '</em>';
  $('topact').innerHTML = '<select class="inp" id="mjS">' + opts.map(o => '<option value="' + o[0] + '-' + o[1] + '"' + (o[0] === S.mjY && o[1] === S.mjM ? ' selected' : '') + '>' + MJ[o[1]] + ' ' + o[0] + (o[2] ? ' (u toku)' : '') + '</option>').join('') + '</select>' +
    '<button class="btn" onclick="mjPrint()">Štampaj / sačuvaj PDF</button><button class="btn pri" onclick="mjMail()">Pošalji upravi</button>';
  $('mjS').onchange = e => { const v = e.target.value.split('-'); S.mjY = +v[0]; S.mjM = +v[1]; R.izvjestaj(); };
  $('view').innerHTML = '<div class="stack" id="mjBox">' + (!x.n ? '<div class="card"><div class="empty"><b>Nema vožnji u mjesecu ' + MJ[x.m] + ' ' + x.y + '</b>Izaberi drugi mjesec.</div></div>' :
    '<div class="grid g4"><div class="card kpi"><span>Izmjereno</span><b>' + fmt(x.km, 1) + ' km</b>' + cmp(+x.km.toFixed(1), +x.kmPrev.toFixed(1), ' km') + '</div>' +
    '<div class="card kpi"><span>Prosječna glatkoća</span><b>' + (x.q == null ? '—' : x.q + '/100') + '</b>' + cmp(x.q, x.qPrev) + '</div>' +
    '<div class="card kpi"><span>Izmjerenih dionica</span><b>' + x.mj.length + '</b><em>' + x.ispod + ' ispod praga ' + DP().prag + '</em></div>' +
    '<div class="card kpi"><span>Pale ispod praga</span><b' + (x.nove.length ? ' style="color:var(--red)"' : '') + '>' + x.nove.length + '</b><em>bile iznad pri prethodnom mjerenju</em></div></div>' +
    '<div class="grid g2"><div class="card"><div class="card-h"><h3>Najlošije izmjerene dionice</h3></div><div class="tblwrap"><table class="tbl"><thead><tr><th>Dionica</th><th>Glatkoća</th><th class="r">Prethodno</th></tr></thead><tbody>' +
      x.worst.map((w, i) => '<tr data-i="' + i + '"><td>' + esc(w.c.name) + '</td><td>' + qCell(w.q) + '</td><td class="r mut">' + (w.prev == null ? '—' : w.prev) + '</td></tr>').join('') + '</tbody></table></div></div>' +
    '<div class="stack"><div class="card"><div class="card-h"><h3>Pale ispod praga u ovom mjesecu</h3></div><div class="card-b">' + (x.nove.length ? x.nove.map(w => '<div style="display:flex;padding:6px 0;border-bottom:1px solid var(--line)"><span style="flex:1">' + esc(w.c.name) + '</span><span class="mut">' + w.prev + ' → </span><b style="color:var(--red);margin-left:4px">' + w.q + '</b></div>').join('') : '<div class="mut">Nijedna dionica nije pala ispod praga.</div>') + '</div></div>' +
    '<div class="card"><div class="card-h"><h3>Vozila</h3></div><div class="card-b">' + Object.keys(x.byV).sort((a, b) => x.byV[b] - x.byV[a]).map(v => '<div style="display:flex;padding:5px 0"><span style="flex:1">' + esc(v) + '</span><span class="mut">' + fmt(x.byV[v], 1) + ' km</span></div>').join('') +
    '<div style="margin-top:10px;color:var(--tx2)">Rupa zabilježenih u mjesecu: <b>' + x.rupe.length + '</b></div></div></div></div></div>') + '</div>';
  document.querySelectorAll('tr[data-i]').forEach(tr => tr.onclick = () => openDion(x.worst[+tr.dataset.i].c));
};
function mjNaslov(){ return 'PINIT Drive — stanje cesta'; }
function mjMail(){
  const x = S._mj, to = ((S.P && S.P.izvjestaj && S.P.izvjestaj.primaoci) || '').replace(/\s+/g, '');
  const t = mjNaslov() + ' — ' + MJ[x.m] + ' ' + x.y + '\n\nIzmjereno: ' + fmt(x.km, 1) + ' km (' + x.n + ' vožnji)\nProsječna glatkoća: ' + (x.q == null ? '—' : x.q + '/100') + (x.qPrev != null ? ' (prethodni mjesec ' + x.qPrev + ')' : '') +
    '\nIzmjerenih dionica: ' + x.mj.length + ', ispod praga: ' + x.ispod + '\nPale ispod praga u mjesecu: ' + x.nove.length + (x.nove.length ? '\n' + x.nove.map(w => '  ' + w.c.name + ': ' + w.prev + ' → ' + w.q).join('\n') : '') +
    '\nRupa zabilježenih: ' + x.rupe.length + '\n\nIzvještaj u PDF-u je u prilogu.';
  (window.EMBED ? window.top : window).location.href = 'mailto:' + to + '?subject=' + encodeURIComponent(mjNaslov() + ' — ' + MJ[x.m] + ' ' + x.y) + '&body=' + encodeURIComponent(t);
}
function mjPrint(){
  const x = S._mj, w = window.open('', '_blank'); if (!w) return toast('Preglednik je blokirao novi prozor. Dozvoli iskačuće prozore za ovu adresu.', 'err');
  w.document.write('<!DOCTYPE html><html lang="bs"><head><meta charset="utf-8"><title>' + esc(mjNaslov() + ' — ' + MJ[x.m] + ' ' + x.y) + '</title><style>' + [...document.querySelectorAll('style')].map(s => s.textContent).join('\n') +
    ':root{--bg:#fff;--panel:#fff;--panel2:#f4f6f5;--line:#dfe6e2;--line2:#cfd8d3;--tx:#111;--tx2:#333;--tx3:#666;--tx4:#888}body{overflow:visible;background:#fff;color:#111;padding:24px}.card{break-inside:avoid}@media print{button{display:none}}</style></head><body>' +
    '<button onclick="print()">Štampaj / sačuvaj PDF</button><h1 style="font-size:22px;margin:10px 0 2px">' + esc(mjNaslov()) + ' — ' + MJ[x.m] + ' ' + x.y + '</h1><div style="color:#666;margin-bottom:16px">' + esc((S.P && S.P.institucija && S.P.institucija.naziv) || '') + ' · izrađeno ' + dateS(Date.now()) + '</div>' + $('mjBox').outerHTML + '</body></html>');
  w.document.close();
}

/* ════════════════════════════════════════════════════════════════════
   7. POSTAVKE — prag i cijene, zajedničke s platformom (dnevnik izmjena)
   ════════════════════════════════════════════════════════════════════ */
R.postavke = function(){
  const P = DP();
  const f = (id, l, v, h) => '<div class="fld"><label for="' + id + '">' + l + '</label><input id="' + id + '" type="number" min="0" value="' + v + '">' + (h ? '<div class="hint">' + h + '</div>' : '') + '</div>';
  $('view').innerHTML = '<div class="card" style="max-width:720px"><div class="card-h"><h3>Postavke mjerenja i sanacije</h3></div><div class="card-b">' +
    '<div class="frow">' + f('sP', 'Prag glatkoće', P.prag, 'Ispod praga dionica ulazi u plan.') + f('sW', 'Širina kolovoza (m)', P.sirinaM, 'Za površinu dionice.') + f('sB', 'Godišnji budžet (KM)', P.budzet) + '</div>' +
    '<div class="frow">' + f('sK', 'Krpljenje (KM/m²)', P.krpljenje) + f('sPr', 'Presvlačenje (KM/m²)', P.presvlacenje) + f('sR', 'Rekonstrukcija (KM/m²)', P.rekonstrukcija) + '</div>' +
    '<p style="font-size:13px;color:var(--tx3);margin:4px 0 14px">Izmjena se upisuje u dnevnik postavki platforme s imenom i vremenom.</p>' +
    '<div style="display:flex;justify-content:flex-end"><button class="btn pri" id="sGo">Sačuvaj</button></div></div></div>';
  $('sGo').onclick = async () => {
    const d = { prag: +$('sP').value, sirinaM: +$('sW').value, budzet: +$('sB').value, krpljenje: +$('sK').value, presvlacenje: +$('sPr').value, rekonstrukcija: +$('sR').value };
    if (!(d.prag > 0 && d.prag < 100)) return toast('Prag mora biti između 1 i 99.', 'err');
    let ime = 'Dispečer'; try { ime = (JSON.parse(localStorage.getItem('pinit_me')) || {}).name || ime; } catch (e) {}
    try { S.P = await api('/api/settings', { method: 'POST', body: { drive: d, byName: ime } }); S.budget = null; build(); toast('Sačuvano.'); } catch (e) { toast(e.message, 'err'); }
  };
};

/* ── učitavanje ── */
async function load(){
  try {
    /* Postavke nisu obavezne za prikaz: bez njih važe polazni prag i cijene. */
    const [D, P] = await Promise.all([api('/api/drives'), api('/api/settings').catch(e => { S.warn = e.message; return null; })]);
    /* Probne vožnje (oznaka „test" s telefona) ne ulaze u stanje mreže. */
    S.D = (D || []).filter(d => d && d.drive && !(d.flags || []).includes('test')); S.P = P;
    $('city').textContent = (P && P.institucija && P.institucija.grad) || '';
    build();
    go(location.hash.slice(1) || S.view);
    /* Stara verzija servera: jasno upozorenje umjesto tihog kvara. */
    fetch('/api/verzija').then(r => r.json()).then(j => { const n = parseInt(String(j.verzija).replace(/\D/g, ''), 10);
      if ((!isNaN(n) && n < 42) || S.warn) { const b = document.createElement('div');
        b.style.cssText = 'background:rgba(240,87,75,.12);border-bottom:1px solid rgba(240,87,75,.55);color:#f3b3ad;font-size:13.5px;padding:10px 24px';
        b.textContent = (!isNaN(n) && n < 42 ? 'Server radi ' + j.verzija + ', a PINIT Drive traži v42 ili noviju — objavi cijeli paket (i server.js). ' : '') + (S.warn || '');
        const m = document.querySelector('.main'); m.insertBefore(b, m.children[1]); } }).catch(() => {});
  } catch (e) { $('view').innerHTML = '<div class="empty"><b>Podaci se ne mogu učitati</b>' + esc(e.message) + '</div>'; }
}
if (!window.__chartMissing) { Chart.defaults.color = '#8f9a96'; Chart.defaults.borderColor = '#2b3330'; Chart.defaults.font.family = 'Inter, system-ui, sans-serif'; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDr(); });
try { $('langBtn').textContent = (window.pinitJezik && pinitJezik() === 'en') ? 'BS' : 'EN'; } catch (e) {}
load();
</script>
