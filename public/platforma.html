<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/icon-192.png">
<meta property="og:type" content="website">

<title>PINIT — Platforma</title>
<script src="/jezik.js"></script>

  window.Chart = function () { return { update: function () {}, destroy: function () {}, resize: function () {} }; };
  window.Chart.defaults = { font: {}, plugins: { legend: { labels: {} }, tooltip: {} }, scale: { grid: {}, ticks: {} } };
  window.__chartMissing = true;
}

<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="/maps.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════════
   VIZUELNI JEZIK (PRD 7.3 i 7.4)
   Tamna podloga jer dispečer gleda isti ekran cijelu smjenu. Osnovna paleta
   je siva uz jednu zelenu. Crvena i žuta se pojavljuju SAMO za hitnost i
   stanje roka — zato crvena uvijek znači isto i ne treba objašnjenje.
   Boje su uzete direktno s ekrana u PRD dokumentu.
   ═══════════════════════════════════════════════════════════════════ */
:root{
  --bg:#161a18;          /* radna površina */
  --panel:#1e2422;       /* bočni meni, kartice */
  --panel2:#232a28;      /* red na hover, polja */
  --line:#2b3330;        /* rubovi */
  --line2:#353e3b;
  --tx:#eaefec;          /* glavni tekst */
  --tx2:#b9c2be;
  --tx3:#8f9a96;         /* sporedni tekst */
  --tx4:#66716d;
  --green:#1c7a35;       /* jedina akcentna boja */
  --green-t:#4cc26a;     /* zelena kao tekst na tamnom */
  --green-s:rgba(28,122,53,.16);
  --red:#f0574b; --red-s:rgba(240,87,75,.13);
  --amber:#e0a93b; --amber-s:rgba(224,169,59,.13);
  --blue:#4c9bd1;        /* samo za stanje „Dodijeljeno" */
  --fn:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:12px; --r2:9px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--fn);background:var(--bg);color:var(--tx);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overflow:hidden;font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
select option{background:var(--panel);color:var(--tx)}
a{color:var(--green-t)}
:focus-visible{outline:2px solid var(--green-t);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#2f3835;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.app{display:grid;grid-template-columns:248px 1fr;height:100vh}

/* ── BOČNI MENI ── */
.side{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:22px 20px 18px;display:flex;align-items:center;gap:8px}
.brand img{height:22px;display:block}
.brand small{font-size:11.5px;color:var(--tx4);margin-left:auto;text-align:right;line-height:1.3}
.svcsel{margin:0 16px 14px;position:relative}
.svcsel select{appearance:none;-webkit-appearance:none;width:100%;background:var(--bg);border:1px solid var(--line2);
  border-radius:10px;padding:11px 36px 11px 13px;font-size:14px;font-weight:500;cursor:pointer}
.svcsel::after{content:"";position:absolute;right:15px;top:50%;width:7px;height:7px;border-right:1.6px solid var(--tx3);
  border-bottom:1.6px solid var(--tx3);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.nav{flex:1;overflow-y:auto;padding:4px 0}
.nav button{display:flex;align-items:center;width:100%;text-align:left;padding:11px 20px 11px 22px;font-size:15px;
  color:var(--tx2);position:relative;transition:background .12s,color .12s}
.nav button:hover{background:rgba(255,255,255,.025);color:var(--tx)}
.nav button.on{color:var(--tx);font-weight:600;background:rgba(255,255,255,.035)}
.nav button.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--green);border-radius:0 3px 3px 0}
.nav .cnt{margin-left:auto;font-size:12.5px;color:var(--green-t);font-weight:600}
.nav .tag{margin-left:auto;font-size:11.5px;color:var(--tx3)}
.me{border-top:1px solid var(--line);padding:14px 20px 16px}
.me b{display:block;font-size:14px;font-weight:600;cursor:pointer}
.me span{font-size:12px;color:var(--tx3)}
.me-row{display:flex;gap:6px;margin-top:10px}
.me-row button{font-size:12px;color:var(--tx3);padding:5px 9px;border:1px solid var(--line2);border-radius:8px}
.me-row button:hover{color:var(--tx);border-color:var(--tx4)}
.ver{font-size:10.5px;color:var(--tx4);margin-top:8px}

/* ── GLAVNI DIO ── */
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{height:64px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;position:relative}
.top h1{font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.search{position:relative;flex:0 1 440px}
.search input{width:100%;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:10px 13px;font-size:14px;outline:none}
.search input:focus{border-color:var(--tx4)}
.search input::placeholder{color:var(--tx4)}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line2);border-radius:12px;
  box-shadow:0 18px 50px rgba(0,0,0,.5);max-height:420px;overflow-y:auto;z-index:60;display:none}
.sres.on{display:block}
.sres button{display:flex;gap:10px;align-items:baseline;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.sres button:hover,.sres button.act{background:var(--panel2)}
.sres b{font-weight:600;white-space:nowrap}
.sres span{color:var(--tx3);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sres .k{margin-left:auto;font-size:11.5px;color:var(--tx4);white-space:nowrap}
.sres .none{padding:14px;color:var(--tx3);font-size:13.5px}
.top .sp{flex:1}
.topact{display:flex;gap:8px;align-items:center}
.bell{width:40px;height:40px;border:1px solid var(--line2);border-radius:10px;position:relative;display:grid;place-items:center;background:var(--panel)}
.bell svg{width:18px;height:18px;fill:var(--tx2)}
.bell i{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;
  font:600 11px/19px var(--fn);font-style:normal;text-align:center;padding:0 5px}
.bellpop{position:absolute;top:58px;right:24px;width:390px;background:var(--panel);border:1px solid var(--line2);border-radius:14px;
  box-shadow:0 18px 50px rgba(0,0,0,.55);z-index:70;display:none;max-height:70vh;overflow-y:auto}
.bellpop.on{display:block}
.bellpop h4{font-size:13px;font-weight:600;padding:14px 16px 10px;color:var(--tx2);display:flex}
.bellpop h4 button{margin-left:auto;font-size:12px;color:var(--tx3);font-weight:400}
.bellpop .it{display:block;width:100%;text-align:left;padding:11px 16px;border-top:1px solid var(--line);font-size:13.5px}
.bellpop .it:hover{background:var(--panel2)}
.bellpop small{display:block;color:var(--tx3);font-size:12px;margin-top:2px}
.bellpop .none{padding:16px;color:var(--tx3);font-size:13.5px;border-top:1px solid var(--line)}
.view{flex:1;overflow-y:auto;padding:24px;min-height:0}
.view.flush{padding:0;overflow:hidden}

/* ── DUGMAD ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:10px;padding:10px 16px;font-size:14px;
  font-weight:500;border:1px solid var(--line2);background:var(--panel);color:var(--tx);white-space:nowrap;transition:border-color .12s,background .12s}
.btn:hover{border-color:var(--tx4)}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btn.pri:hover{background:#218a3d}
.btn.out{background:transparent;border-color:rgba(76,194,106,.55);color:var(--green-t)}
.btn.out:hover{background:var(--green-s)}
.btn.dng{border-color:rgba(240,87,75,.45);color:var(--red);background:transparent}
.btn.dng:hover{background:var(--red-s)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px;fill:currentColor}
.lnk{color:var(--tx3);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--tx)}

/* ── KARTICE I TABELE ── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.card-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.card-h h3{font-size:15px;font-weight:600}
.card-h .sub{font-size:12.5px;color:var(--tx3)}
.card-h .sp{flex:1}
.card-b{padding:16px 18px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr)}
@media (max-width:1180px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g3{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.kpi{padding:18px 20px 16px}
.kpi b{display:block;font-size:34px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.kpi b small{font-size:16px;color:var(--tx3);font-weight:500;margin-left:2px}
.kpi span{display:block;font-size:14px;color:var(--tx2);margin-top:6px}
.kpi em{display:block;font-style:normal;font-size:12px;color:var(--tx3);margin-top:4px}
.kpi em.up{color:var(--green-t)} .kpi em.bad{color:var(--red)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;font-weight:500;color:var(--tx3);text-align:left;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.02em}
.tbl td{padding:14px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{cursor:pointer;transition:background .1s}
.tbl tbody tr:hover{background:var(--panel2)}
.tbl tbody tr.sel{background:#243230}
.tbl.static tbody tr{cursor:default}
.tbl.static tbody tr:hover{background:transparent}
.tbl .num{font-weight:600;white-space:nowrap}
.tbl .mut{color:var(--tx3)}
.tbl td.loc{max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl .r{text-align:right}
.tblwrap{overflow-x:auto}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#6b7572;vertical-align:middle;flex:none}
.dot.urgent{background:var(--red)} .dot.med{background:var(--amber)} .dot.low{background:#6b7572}
.st{font-size:12.5px;font-weight:600;white-space:nowrap}
.st.s-new{color:var(--tx2)} .st.s-asg{color:var(--blue)} .st.s-prog{color:var(--amber)} .st.s-done{color:var(--green-t)}
.st.s-closed{color:#3d9b56} .st.s-merged{color:var(--tx4)}
.due{font-weight:600;white-space:nowrap}
.due.over{color:var(--red)} .due.warn{color:var(--amber)} .due.ok{color:var(--tx)} .due.none{color:var(--tx4);font-weight:400}
.msgc{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--green);color:#fff;font-size:12px;font-weight:600;padding:0 6px}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1px solid var(--line2);border-radius:10px;padding:8px 15px;font-size:14px;color:var(--tx2);background:transparent}
.pill:hover{color:var(--tx);border-color:var(--tx4)}
.pill.on{border-color:rgba(76,194,106,.6);color:var(--green-t);background:var(--green-s);font-weight:500}
.pill small{margin-left:6px;color:var(--tx3);font-size:12px}
.pill.on small{color:var(--green-t)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:3px 9px;border-radius:7px;border:1px solid var(--line2);color:var(--tx2);white-space:nowrap}
.chip.red{border-color:rgba(240,87,75,.5);color:var(--red)}
.chip.amber{border-color:rgba(224,169,59,.5);color:var(--amber)}
.chip.green{border-color:rgba(76,194,106,.5);color:var(--green-t)}
.chip.blue{border-color:rgba(76,155,209,.5);color:var(--blue)}
.empty{padding:34px 20px;text-align:center;color:var(--tx3);font-size:14px;line-height:1.55}
.empty b{display:block;color:var(--tx);font-weight:600;margin-bottom:4px;font-size:15px}
.empty .btn{margin-top:14px}
.note{border:1px solid var(--line2);border-radius:var(--r);padding:12px 16px;font-size:13.5px;color:var(--tx2);display:flex;gap:14px;align-items:baseline;background:var(--panel)}
.note b{font-size:11.5px;letter-spacing:.06em;color:var(--tx3);font-weight:600;white-space:nowrap}
.note.warn{border-color:rgba(224,169,59,.55);background:rgba(224,169,59,.07);color:#e7c77f}
.note.warn b{color:var(--amber)}

/* ── UPOZORENJE O ROKU ── */
.alarm{border:1px solid rgba(240,87,75,.7);border-radius:var(--r);padding:16px 18px;margin-bottom:18px}
.alarm h3{font-size:16px;font-weight:600;color:var(--red);margin-bottom:12px}
.alarm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:12px}
.alarm-it{background:var(--panel);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer;text-align:left;width:100%}
.alarm-it:hover{background:var(--panel2)}
.alarm-it .l{flex:1;min-width:0}
.alarm-it b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.alarm-it span{font-size:13px;color:var(--tx3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.alarm-it .due{font-size:16px}

/* ── REDOVI U LISTAMA ── */
.row{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.row .t{font-weight:600;min-width:0;flex:0 0 170px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{flex:1;color:var(--tx2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{color:var(--tx3);font-size:13px;white-space:nowrap}
.row.click{cursor:pointer}
.row.click:hover{background:var(--panel2)}
.wrow{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line)}
.wrow:last-child{border-bottom:none}
.wrow .n{flex:1;min-width:0}
.wrow .n b{display:block;font-weight:500}
.wrow .n span{font-size:12.5px;color:var(--tx3)}
.wrow .free{color:var(--green-t);font-weight:500;font-size:13.5px}
.wrow .load{color:var(--tx2);font-size:13.5px}
.av{width:34px;height:34px;border-radius:50%;background:#2b3431;display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--tx2);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}

/* ── PADAJUĆI IZBOR RADNIKA (dodjela jednim odabirom) ── */
.pickpop{position:fixed;z-index:90;background:var(--panel);border:1px solid var(--line2);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.6);
  min-width:300px;max-height:380px;overflow-y:auto;display:none}
.pickpop.on{display:block}
.pickpop .h{padding:10px 14px;font-size:12px;color:var(--tx3);border-bottom:1px solid var(--line)}
.pickpop button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
.pickpop button:hover{background:var(--panel2)}
.pickpop button .n{flex:1}
.pickpop button .n small{display:block;color:var(--tx3);font-size:12px}
.pickpop .empty{padding:18px}

/* ── BOČNA PLOČA NALOGA (PRD: ne novi ekran, da se ne izgubi mjesto) ── */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(540px,100vw);background:var(--panel);border-left:1px solid var(--line2);
  box-shadow:-24px 0 60px rgba(0,0,0,.45);transform:translateX(104%);transition:transform .22s ease;z-index:50;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dr-h .t{flex:1;min-width:0}
.dr-h h2{font-size:18px;font-weight:600}
.dr-h p{font-size:13px;color:var(--tx3);margin-top:3px}
.x{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--tx3);flex:none}
.x:hover{background:var(--panel2);color:var(--tx)}
.x svg{width:18px;height:18px;fill:currentColor}
.dr-b{flex:1;overflow-y:auto;padding:18px 20px}
.dr-f{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:6px;flex-wrap:wrap}
.dr-f .btn{padding:7px 12px;font-size:13px;border-radius:9px}
.sec{margin-bottom:22px}
.sec h4{font-size:12px;font-weight:500;color:var(--tx3);margin-bottom:9px;letter-spacing:.03em}
.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;font-size:14px}
.kv dt{color:var(--tx3)}
.kv dd{min-width:0;overflow-wrap:anywhere}
.minimap{height:170px;border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-top:10px;background:#101312;position:relative}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.ph{border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#101312;position:relative}
.ph img{display:block;width:100%;height:120px;object-fit:cover;cursor:zoom-in}
.ph .nof{height:120px;display:grid;place-items:center;color:var(--tx4);font-size:12.5px;padding:10px;text-align:center}
.ph span{display:block;font-size:12px;color:var(--tx3);padding:6px 9px}
.ph .acts{display:flex;gap:6px;padding:0 8px 8px}
.tl{list-style:none;border-left:1px solid var(--line2);margin-left:5px}
.tl li{position:relative;padding:0 0 14px 18px;font-size:13.5px}
.tl li::before{content:"";position:absolute;left:-5px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--line2);border:2px solid var(--panel)}
.tl li.g::before{background:var(--green-t)}
.tl li.r::before{background:var(--red)}
.tl li small{display:block;color:var(--tx3);font-size:12px}
.work{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.55}
.work small{color:var(--tx3);display:block;margin-top:6px}

/* ── MODAL ── */
.mbg{position:fixed;inset:0;background:rgba(6,8,7,.66);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.mbg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:min(540px,100%);max-height:88vh;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.wide{width:min(760px,100%)}
.m-h{padding:20px 22px 6px;display:flex;align-items:flex-start;gap:12px}
.m-h .t{flex:1}
.m-h h2{font-size:18px;font-weight:600}
.m-h p{font-size:13px;color:var(--tx3);margin-top:4px}

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   PINIT PLATFORMA — radno mjesto dispečerskog centra (PRD pogl. 10)

   Sve na ekranu dolazi sa servera. Nema izmišljenih podataka: prazna
   evidencija prikazuje prazno stanje s objašnjenjem i radnjom.
   Promjene (dodjela, stanje, poruka) upisuju se odmah — nema dugmeta
   „Sačuvaj" osim u Postavkama, gdje potvrda ima smisla.
   ════════════════════════════════════════════════════════════════════ */

/* ── ZAŠTITA OD UBACIVANJA KODA ──
   Sve što je upisao neko drugi (građanin, radnik) prolazi kroz esc() prije
   nego uđe u HTML, da tekst ne može postati skripta. */
function esc(v){ if(v===null||v===undefined) return ''; return String(v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
const $ = id => document.getElementById(id);
const DAY = 864e5, HOUR = 36e5, MIN = 6e4;

/* ── KATEGORIJE ──
   Kategorija nije oznaka nego odluka o tome ko dobija posao i za koliko sati.
   Služba i rok dolaze iz Postavki; ovdje su samo nazivi. */
const CATS = {
  staklo:{n:'Staklo / opasnost'}, putevi:{n:'Rupa / oštećenje'}, voda:{n:'Curenje / cijev'},
  poplava:{n:'Poplava / kanal'}, rasveta:{n:'Rasvjeta'}, otpad:{n:'Otpad / smeće'},
  predmet:{n:'Predmet na putu'}, elektro:{n:'Kvar struje'}, ostalo:{n:'Ostalo'}
};
const catN = c => (CATS[String(c||'').toLowerCase()]||{}).n || (c ? String(c) : 'Nepoznato');

/* ── STANJE APLIKACIJE ── */
const S = {
  R: [],            // sve prijave (bez fotografija)
  W: [],            // radnici
  P: null,          // postavke institucije
  view: 'pregled',
  svc: localStorage.getItem('pinit_svc') || 'all',
  tab: {},          // izabrana kartica po ekranu
  sel: null,        // otvoreni nalog u bočnoj ploči
  loaded: false,
  online: true
};
const ME = (function(){ try{ return JSON.parse(localStorage.getItem('pinit_me'))||null; }catch(e){ return null; } })()
  || { name:'', role:'dispečer', shift:'' };

/* ── RAZGOVOR SA SERVEROM ── */
async function api(path, opt){
  opt = opt || {};
  let r;
  try {
    r = await fetch(path, { method: opt.method || 'GET', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      body: opt.body ? JSON.stringify(opt.body) : undefined });
  } catch (e) { throw new Error('Nema veze sa serverom. Provjeri internet pa pokušaj ponovo.'); }
  let j = null; try { j = await r.json(); } catch (e) {}
  if (r.status === 401) {
    /* Sesija je istekla: vrati na prijavu, ali ne usred kucanja poruke. */
    toast('Sesija je istekla — prijavi se ponovo.', 'err');
    setTimeout(() => location.href = '/platforma', 1400);
    throw new Error('Sesija je istekla.');
  }
  if (!r.ok) {
    /* Poruka kaže TAČNO šta je zakazalo — adresu i odgovor servera — da se
       problem može prijaviti, a ne samo „ne radi". 404 znači da server ne
       poznaje rutu: skoro uvijek je server starija verzija od platforme. */
    const e = new Error((j && j.error) || (r.status === 404 ? 'Server ne poznaje ' + path.split('?')[0] + ' — server je vjerovatno starija verzija od platforme.' : 'Server je odgovorio greškom ' + r.status + ' na ' + path.split('?')[0] + '.'));
    e.status = r.status; e.path = path; throw e;
  }
  return j;
}
const patch = (id, body) => api('/api/reports/' + id, { method: 'PATCH', body: Object.assign({ byName: meName() }, body) });
function meName(){ return ME.name || 'Dispečer'; }

/* ── POMOĆNE FUNKCIJE ZA VRIJEME ── */
function hm(ms){
  ms = Math.abs(ms);
  const d = Math.floor(ms / DAY), h = Math.floor(ms % DAY / HOUR), m = Math.floor(ms % HOUR / MIN);
  if (d >= 1) return d + (d === 1 ? ' dan' : ' dana') + (h ? ' ' + h + ' h' : '');
  if (h >= 1) return h + ' h' + (m ? ' ' + String(m).padStart(2,'0') + ' min' : '');
  return Math.max(1, m) + ' min';
}
function clock(t){ const d = new Date(t); return d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0'); }
function dateT(t){ if(!t) return '—'; const d = new Date(t);
  return d.getDate() + '. ' + (d.getMonth()+1) + '. ' + d.getFullYear() + '. u ' + clock(t); }
function whenShort(t){ const d = new Date(t), n = new Date();
  if (d.toDateString() === n.toDateString()) return clock(t);
  const y = new Date(n - DAY); if (d.toDateString() === y.toDateString()) return 'jučer ' + clock(t);
  return d.getDate() + '. ' + (d.getMonth()+1) + '.'; }
function ago(t){ return 'prije ' + hm(Date.now() - t); }
const plural = (n, a, b, c) => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? a : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14)) ? b : c);

/* ── SLUŽBE ── */
function services(){ return ((S.P && S.P.sluzbe) || []).filter(s => s.aktivna !== false); }
function svcName(id){ const s = ((S.P && S.P.sluzbe) || []).find(x => x.id === id); return s ? s.naziv : (id || '—'); }
function svcOfCat(cat){ const k = String(cat||'').toLowerCase(); return (S.P && S.P.kategorije && S.P.kategorije[k]) || 'putevi'; }

/* ════════════════════════════════════════════════════════════════════
   NALOG — jedan pogled na jedan zapis sa servera
   ════════════════════════════════════════════════════════════════════ */
function hitnost(r){
  /* Stepen hitnosti: ako ga je dispečer postavio, važi njegov. Inače ga
     podižu kategorija i broj glasova, po pravilima iz Postavki (PL-84). */
  if (r.pri) return r.pri;
  const h = (S.P && S.P.hitnost) || {};
  if ((h.hitneKategorije || []).indexOf(String(r.cat)) >= 0) return 'urgent';
  const v = r.votes || 0;
  if (v >= (h.glasovaHitno || 25)) return 'urgent';
  if (v >= (h.glasovaSrednje || 10)) return 'med';
  return 'low';
}
function stanje(r){
  if (r.mergedInto) return { k:'merged', n:'Spojeno' };
  if (r.status === 3) return r.closedAt ? { k:'closed', n:'Zatvoreno' } : { k:'done', n:'Riješeno' };

      return '<div class="card"><div class="card-h"><h3>Red novih prijava</h3><span class="sub">' + (q.length ? q.length + ' čeka dodjelu' : '') + '</span></div>' +
        (q.length ? q.slice(0, 12).map(r => '<div class="row click" onclick="openOrder(' + r.id + ')"><span class="dot ' + hitnost(r) + '"></span>' +
          '<span class="t">' + esc(catN(r.cat)) + '</span><span class="a">' + esc(adresa(r)) + (r.izSluzbe ? ' <span class="chip">iz službe</span>' : '') + '</span>' +
          '<span class="m">' + whenShort(r.ts) + '</span><span class="m" style="width:74px">' + plural(r.votes || 0, 'glas', 'glasa', 'glasova') + '</span>' +
          '<button class="btn sm out" data-pick onclick="event.stopPropagation();assignFrom(this,' + r.id + ')">Dodijeli</button></div>').join('') +
          (q.length > 12 ? '<div class="row"><button class="lnk" onclick="S.tab.zadaci=\'novi\';go(\'zadaci\')">Prikaži svih ' + q.length + '</button></div>' : '')
          : '<div class="empty"><b>Nema prijava koje čekaju dodjelu</b>Nova prijava se ovdje pojavi čim stigne. Poziv preko telefona unesi dugmetom Novi zadatak ručno.</div>') + '</div>';
    }
    if (k === 'radnici') {
      const ws = workersInScope().filter(w => onShift(w)).map(w => ({ w, l: load(w.id) })).sort((a, b) => a.l - b.l);
      return '<div class="card"><div class="card-h"><h3>Radnici na smjeni</h3><span class="sp"></span><button class="lnk" onclick="go(\'radnici\')">Svi radnici</button></div>' +
        (ws.length ? ws.map(x => '<div class="wrow"><div class="n"><b>' + esc(x.w.name) + '</b><span>' + esc(svcName(x.w.dept)) + (gpsFresh(x.w) ? ' · na terenu' : '') + '</span></div>' +
          (x.l ? '<span class="load">' + plural(x.l, 'nalog', 'naloga', 'naloga') + '</span>' : '<span class="free">Slobodan</span>') + '</div>').join('')
          : '<div class="empty"><b>Niko nije na smjeni</b>' + (S.W.length ? 'Smjene se podešavaju u sekciji Radnici.' : 'Dodaj prvog radnika — dobiće kod i PIN za aplikaciju.') +
            '<br><button class="btn sm" onclick="go(\'radnici\')">' + (S.W.length ? 'Otvori smjene' : 'Dodaj radnika') + '</button></div>') + '</div>';
    }
    if (k === 'rokovi') {
      const a = O.filter(r => isOpen(r) && rok(r).k !== 'ok').sort((x, y) => rok(x).ms - rok(y).ms);
      return '<div class="card"><div class="card-h"><h3>Upozorenja o roku</h3></div>' + (a.length ? a.slice(0, 8).map(r => { const k = rok(r);
        return '<div class="row click" onclick="openOrder(' + r.id + ')"><span class="t">' + orderNo(r) + ' · ' + esc(catN(r.cat)) + '</span><span class="a">' + esc(adresa(r)) + '</span><span class="due ' + k.k + '">' + k.t + '</span></div>'; }).join('')
        : '<div class="empty">Nijedan nalog nije blizu isteka roka.</div>') + '</div>';
    }
    if (k === 'poruke') {
      const a = O.filter(r => r.chatLast && !r.chatLast.sys).sort((x, y) => y.chatLast.t - x.chatLast.t).slice(0, 7);
      return '<div class="card"><div class="card-h"><h3>Posljednje poruke</h3><span class="sp"></span><button class="lnk" onclick="go(\'razgovori\')">Razgovori</button></div>' +
        (a.length ? a.map(r => '<div class="row click" onclick="go(\'razgovori\',{open:' + r.id + '})"><span class="t">' + orderNo(r) + '</span><span class="a">' +
          esc(r.chatLast.byName) + ': ' + esc(r.chatLast.text) + '</span>' + (unread(r) ? '<span class="msgc">' + unread(r) + '</span>' : '<span class="m">' + whenShort(r.chatLast.t) + '</span>') + '</div>').join('')
        : '<div class="empty">Još nema poruka. Razgovor se otvara sam kad dodijeliš nalog.</div>') + '</div>';
    }
    if (k === 'karta') {
      return '<div class="card"><div class="card-h"><h3>Karta otvorenih prijava</h3><span class="sub">' + O.filter(r => isOpen(r) && typeof r.lat === 'number').length + ' na karti</span><span class="sp"></span><button class="lnk" onclick="go(\'karta\')">Otvori kartu</button></div>' +
        '<div id="pgMapSlot" style="height:340px;position:relative;border-radius:0 0 12px 12px;overflow:hidden"></div></div>';
    }
    if (k === 'foto') {
      const a = S.R.filter(r => r.hasPhoto && r.photoOk !== true && !r.photoRejected && !r.mergedInto);
      return '<div class="card"><div class="card-h"><h3>Fotografije za pregled</h3><span class="sub">' + (a.length || '') + '</span><span class="sp"></span>' +
        (a.length ? '<button class="lnk" onclick="S.tab.zadaci=\'foto\';go(\'zadaci\')">Pregledaj</button>' : '') + '</div>' +
        '<div class="card-b" style="color:var(--tx2)">' + (a.length ? plural(a.length, 'fotografija čeka', 'fotografije čekaju', 'fotografija čeka') + ' odobrenje prije nego je vide građani.' : 'Nema fotografija koje čekaju odobrenje.') + '</div></div>';
    }
    return '';
  });
  /* Red prijava i radnici stoje jedno pored drugog kao na PRD ekranu. */
  const out = []; const cfg = cardCfg();
  for (let i = 0; i < cfg.length; i++) {
    if (cfg[i] !== 'kpi' && cfg[i + 1] && cfg[i + 1] !== 'kpi') { out.push('<div class="grid g21">' + html[i] + html[i + 1] + '</div>'); i++; }
    else out.push(html[i]);
  }
  $('view').innerHTML = '<div class="stack">' + out.join('') + '</div>';
  pgMap();
};
/* Karta u Pregledu: isti čvor se premješta u novu karticu pri svakom
   osvježavanju, pa karta ne treperi i ne gubi položaj. */
let PGM = null, PGEL = null;
function pgMap(){
  const slot = $('pgMapSlot'); if (!slot) return;
  if (!PGEL) { PGEL = document.createElement('div'); PGEL.style.cssText = 'position:absolute;inset:0'; PGEL.id = 'pgMapEl'; }
  slot.appendChild(PGEL);
  const draw = () => {
    if (!PGM || !PGM.isStyleLoaded()) { if (PGM) PGM.once('idle', draw); return; }
    const O = orders().filter(r => isOpen(r) && typeof r.lat === 'number');
    const fc = { type: 'FeatureCollection', features: O.map(r => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [r.lng, r.lat] }, properties: { id: r.id, p: hitnost(r) } })) };
    if (PGM.getSource('pg')) PGM.getSource('pg').setData(fc); else PGM.addSource('pg', { type: 'geojson', data: fc });
    if (!PGM.getLayer('pg')) {
      PGM.addLayer({ id: 'pg', type: 'circle', source: 'pg', paint: { 'circle-radius': 6, 'circle-color': ['match', ['get', 'p'], 'urgent', '#f0574b', 'med', '#e0a93b', '#8f9a96'], 'circle-stroke-color': '#161a18', 'circle-stroke-width': 1.5 } });
      PGM.on('click', 'pg', e => { const f = e.features && e.features[0]; if (f) openOrder(+f.properties.id); });
      PGM.on('mouseenter', 'pg', () => PGM.getCanvas().style.cursor = 'pointer'); PGM.on('mouseleave', 'pg', () => PGM.getCanvas().style.cursor = '');
      if (O.length) { const xs = O.map(r => r.lng), ys = O.map(r => r.lat); try { PGM.fitBounds([[Math.min(...xs), Math.min(...ys)], [Math.max(...xs), Math.max(...ys)]], { padding: 40, maxZoom: 15, duration: 0 }); } catch (e) {} }
    }
  };
  if (!PGM) {
    try { const c = centerGuess(); PGM = PINIT_MAPS.init('pgMapEl', Object.assign({ dark: true, freeRoam: true, zoom: 12, noControls: true }, c)); if (!PGM) throw 0;
      PGM.on('load', draw); PGM.on('style.load', () => { try { if (PGM.getLayer('pg')) PGM.removeLayer('pg'); } catch (e) {} draw(); }); }
    catch (e) { PGEL.innerHTML = '<div class="mapfail">Karta nije dostupna.</div>'; return; }
  } else { try { PGM.resize(); } catch (e) {} draw(); }
}
function customize(){
  let cfg = cardCfg();
  const draw = () => {
    const all = cfg.concat(Object.keys(CARDS).filter(k => cfg.indexOf(k) < 0));
    $('cfgList').innerHTML = all.map(k => { const on = cfg.indexOf(k) >= 0, i = cfg.indexOf(k);
      return '<div class="cardcfg"><input type="checkbox" ' + (on ? 'checked' : '') + ' data-k="' + k + '" style="width:18px;height:18px;accent-color:var(--green)">' +
        '<span>' + CARDS[k] + '</span><button data-up="' + k + '" ' + (!on || i === 0 ? 'disabled' : '') + ' aria-label="Gore">↑</button>' +
        '<button data-dn="' + k + '" ' + (!on || i === cfg.length - 1 ? 'disabled' : '') + ' aria-label="Dolje">↓</button></div>'; }).join('');
    $('cfgList').querySelectorAll('input').forEach(c => c.onchange = () => { const k = c.dataset.k;
      cfg = c.checked ? cfg.concat([k]) : cfg.filter(x => x !== k); draw(); });
    $('cfgList').querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const i = cfg.indexOf(b.dataset.up); [cfg[i-1], cfg[i]] = [cfg[i], cfg[i-1]]; draw(); });
    $('cfgList').querySelectorAll('[data-dn]').forEach(b => b.onclick = () => { const i = cfg.indexOf(b.dataset.dn); [cfg[i+1], cfg[i]] = [cfg[i], cfg[i+1]]; draw(); });
  };
  openModal(mHead('Prilagodi kartice', 'Izbor i redoslijed se pamte za tebe na ovom računaru.') +
    '<div class="m-b" id="cfgList"></div><div class="m-f"><button class="btn" onclick="closeModal()">Odustani</button>' +
    '<button class="btn pri" id="cfgSave">Primijeni</button></div>');
  draw();
  $('cfgSave').onclick = () => { if (!cfg.length) return toast('Izaberi bar jednu karticu.', 'err');
    localStorage.setItem('pinit_cards', JSON.stringify(cfg)); closeModal(); rerender(); };
}

      closeModal(); toast('Otvoren nalog N-' + j.no + '.'); await pull(true); openOrder(j.id);

/* Kad služba nema zonu, karta se centrira na postojeće prijave. */
function centerGuess(){
  const p = S.R.filter(r => typeof r.lat === 'number');
  if (!p.length) return {};
  return { lat: p.reduce((a, r) => a + r.lat, 0) / p.length, lng: p.reduce((a, r) => a + r.lng, 0) / p.length };
}

  ['novi', 'Novi', r => r.status < 3 && !r.worker && !r.mergedInto],
  ['toku', 'U toku', r => r.status < 3 && r.worker && !r.mergedInto],
  ['rok', 'Upozorenja o roku', r => isOpen(r) && rok(r).k !== 'ok'],

        '<b>Još nema nijedne prijave</b>Prijave građana stižu same iz aplikacije. Poziv preko telefona unesi ručno.<br><button class="btn pri" onclick="newTask()">Novi zadatak ručno</button>') + '</div></td></tr>') +

  $('view').innerHTML = h;

  const tr = document.querySelector('tr[data-id="' + id + '"]'); if (tr) tr.classList.add('sel');

  $('drawer').classList.add('on'); $('drawer').setAttribute('aria-hidden', 'false');

  if (r.status === 0 && !r.mergedInto) { patch(r.id, { status: 1 }).then(() => pull(true)).catch(() => {}); }
  if (!S.O) loadOprema().then(() => { if (S.sel === id) drawOrder(S.R.find(x => x.id === id) || r, FULL); });

}

function drawerActions(r){

  const nadz = ME.role === 'nadzornik';
  if (r.status < 3) {
    b.push('<button class="btn ' + (r.worker ? '' : 'pri') + '" data-pick onclick="assignFrom(this,' + r.id + ')">' + (r.worker ? 'Promijeni izvršioca' : 'Dodijeli') + '</button>');
    if (r.worker) b.push('<button class="btn" onclick="editCrew(' + r.id + ')">Ekipa</button>');
    b.push('<button class="btn" onclick="setPri(' + r.id + ')">Hitnost</button>');
    b.push('<button class="btn" onclick="forward(' + r.id + ')">Proslijedi</button>');
    b.push('<button class="btn" onclick="mergeDlg(' + r.id + ')">Spoji duplikat</button>');
    b.push('<button class="btn out" onclick="closeWithPhoto(' + r.id + ')">Zatvori uz fotografiju</button>');

    if (!r.closedAt) b.push('<button class="btn pri" onclick="approveClose(' + r.id + ')">Zatvori nalog</button>');

  return '<div class="dr-f">' + b.join('') + '</div>';
}

function mergeDlg(id){
  const r = S.R.find(x => x.id === id);
  const R = (S.P && S.P.duplikati && S.P.duplikati.radiusM) || 100;
  const d = (a, b) => { const k = Math.PI / 180, x = (b.lng - a.lng) * k * Math.cos((a.lat + b.lat) / 2 * k), y = (b.lat - a.lat) * k; return Math.sqrt(x * x + y * y) * 6371000; };
  const cand = S.R.filter(o => o.id !== id && !o.mergedInto && o.status < 3 && o.cat === r.cat)
    .map(o => ({ o, m: (typeof o.lat === 'number' && typeof r.lat === 'number') ? d(r, o) : null }))
    .sort((a, b) => (a.m == null ? 1e9 : a.m) - (b.m == null ? 1e9 : b.m)).slice(0, 12);
  openModal(mHead('Spoji istovjetne prijave', 'Ova prijava (' + orderNo(r) + ') postaje dio izabranog naloga; glasovi se zbrajaju.') + '<div class="m-b">' +
    (cand.length ? cand.map(c => '<button class="row click" style="width:100%;text-align:left;border:1px solid var(--line);border-radius:10px;margin-bottom:8px" data-into="' + c.o.id + '">' +
      '<span class="t" style="flex:0 0 80px">' + orderNo(c.o) + '</span><span class="a">' + esc(adresa(c.o)) + '</span><span class="m">' + (c.m == null ? 'bez lokacije' : Math.round(c.m) + ' m') +
      (c.m != null && c.m <= R ? ' · u poluprečniku' : '') + '</span></button>').join('')
      : '<div class="empty">Nema drugih otvorenih prijava iste kategorije.</div>') +
    '</div><div class="m-f"><button class="btn" onclick="closeModal()">Odustani</button></div>');
  document.querySelectorAll('[data-into]').forEach(b => b.onclick = async () => {
    try { const j = await api('/api/reports/' + id + '/merge', { method: 'POST', body: { into: +b.dataset.into, byName: meName() } });
      closeModal(); toast('Spojeno. Nalog sada ima ' + plural(j.votes, 'glas', 'glasa', 'glasova') + '.'); await pull(true); openOrder(+b.dataset.into); }
    catch (e) { toast(e.message, 'err'); } });
}

/* ── TROŠKOVI: računi sa slikama; građanin vidi ukupni iznos ── */
async function openCost(id){
  let f; try { f = await api('/api/reports/' + id); } catch (e) { return toast(e.message, 'err'); }
  let inv = (f.invoices || []).map(x => ({ amount: x.amount, img: x.img || null, at: x.at }));
  let pend = null;
  const draw = () => {
    const tot = inv.reduce((a, x) => a + (+x.amount || 0), 0);
    $('invL').innerHTML = (inv.length ? inv.map((x, i) => '<div class="wrow" style="padding:10px 0">' + (x.img ? '<img src="' + x.img + '" style="width:44px;height:44px;border-radius:8px;object-fit:cover;cursor:zoom-in" onclick="lightbox(this.src)">' : '<span class="av">KM</span>') +
      '<div class="n"><b>' + Number(x.amount).toLocaleString('hr-HR') + ' KM</b><span>' + (x.img ? 'sa slikom računa' : 'bez slike') + '</span></div><button class="btn sm" data-del="' + i + '">Ukloni</button></div>').join('')
      : '<div style="color:var(--tx3);padding:6px 0 10px">Još nema upisanih računa.</div>') + '<div style="margin-top:6px;font-weight:600">Ukupno: ' + tot.toLocaleString('hr-HR') + ' KM</div>';
    $('invL').querySelectorAll('[data-del]').forEach(b => b.onclick = () => { inv.splice(+b.dataset.del, 1); draw(); });
  };
  openModal(mHead('Troškovi naloga', orderNo(f) + ' · materijal, rad, podizvođač') + '<div class="m-b"><div id="invL"></div>' +
    '<div class="frow" style="margin-top:14px;align-items:end"><div class="fld"><label for="invA">Iznos računa (KM)</label><input id="invA" type="number" min="0" step="0.01"></div>' +
    '<div class="fld" style="display:flex;gap:8px"><button class="btn" id="invP">Slika računa</button><button class="btn out" id="invAdd">Dodaj</button></div></div></div>' +
    '<div class="m-f"><button class="btn" onclick="closeModal()">Odustani</button><button class="btn pri" id="invSave">Sačuvaj troškove</button></div>');
  draw();
  $('invP').onclick = async () => { pend = await pickPhoto(); if (pend) $('invP').textContent = 'Slika izabrana'; };
  $('invAdd').onclick = () => { const v = parseFloat($('invA').value); if (!(v >= 0)) return toast('Upiši iznos u KM.', 'err');
    inv.push({ amount: Math.round(v * 100) / 100, img: pend, at: Date.now() }); pend = null; $('invA').value = ''; $('invP').textContent = 'Slika računa'; draw(); };
  $('invSave').onclick = async () => { try { await patch(id, { invoices: inv }); closeModal(); toast('Troškovi sačuvani.'); await pull(true); if (S.sel === id) openOrder(id); } catch (e) { toast(e.message, 'err'); } };
}

    .concat(d.list.map(x => [x.addr, catN(x.cat), svcName(x.svc), lvlOf(x.score)[1], Math.round(x.score * 100), x.c.R.length, x.izlasci, x.ponov, x.potvrdjeno,
      x.last ? new Date(x.last).toLocaleDateString('bs') : '', x.trosak == null ? '' : x.trosak, x.godisnje == null ? '' : x.godisnje, x.c.lat.toFixed(5) + ' ' + x.c.lng.toFixed(5)])));
}
function csv(name, rows){
  const t = '\ufeff' + rows.map(r => r.map(v => { v = v == null ? '' : String(v); return /[;"\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv;charset=utf-8' })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast('Preuzeto: ' + name);
}

    '<div class="ch-main" id="chMain"></div><div class="ctx" id="chCtx"></div></div>';

}
async function openChannel(id){

}
async function loadMsgs(scroll){

    : '<div class="compose"><label class="att" title="Pošalji fotografiju" id="chAtt"><svg viewBox="0 0 24 24"><path d="M9 4 7.2 6H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3.2L15 4H9Zm3 4.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9Z"/></svg></label>' +
      '<textarea id="chTx" placeholder="Poruka za ' + esc(wName(r && r.worker)) + (r && (r.participants || []).length ? ' i ostale učesnike' : '') + '" rows="1"></textarea><button class="btn pri" id="chGo">Pošalji</button></div>';
  if (!CH.locked) {

async function sendMsg(photo){

function drawCtx(){

    people.map(id => { const w = workerById(id); if (!w) return '';
      const role = id === r.worker ? 'izvršilac' : (r.crew || []).indexOf(id) >= 0 ? 'ekipa' : (w.guest ? 'izvođač' : 'učesnik');
      return '<div class="wrow" style="padding:10px 0"><span class="av">' + esc(w.av || '?') + '</span><div class="n"><b>' + esc(w.name) + '</b><span>' + role + ' · ' + plural(load(id), 'aktivan nalog', 'aktivna naloga', 'aktivnih naloga') + '</span></div>' +

<script>
'use strict';
/* ════════════════════════════════════════════════════════════════════
   RADNICI (PL-60 … PL-65)
   ════════════════════════════════════════════════════════════════════ */
RENDER.radnici = function(){
  const tab = S.tab.radnici || 'tim';

  const T = [['tim','Pregled tima'],['smjene','Smjene'],['oprema','Oprema'],['ucinak','Učinak'],['pravednost','Pravednost raspodjele']];
  let h = '<div class="pills" style="margin-bottom:16px">' + T.map(t => '<button class="pill' + (tab === t[0] ? ' on' : '') + '" onclick="S.tab.radnici=\'' + t[0] + '\';rerender()">' + t[1] + '</button>').join('') + '</div>';
  if (tab === 'oprema') { $('topact').innerHTML = '<button class="btn pri" onclick="oprEdit()">Dodaj opremu</button>'; $('view').innerHTML = h + '<div id="oprBox"></div>'; renderOpremaP(); return; }
  const ws = workersInScope();
  if (!ws.length) { $('view').innerHTML = h + '<div class="card"><div class="empty"><b>' + (S.W.length ? 'U ovoj službi još nema radnika' : 'Još nema nijednog radnika') + '</b>' +
    'Radnik dobija pristupni kod i PIN za aplikaciju na terenu. Ulazi bez e-pošte i lozinke.<br><button class="btn pri" onclick="addWorker()">Dodaj radnika</button></div></div>'; return; }
  if (tab === 'tim') {
    h += '<div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>Ime</th><th>Služba</th><th>Uloga</th><th>Kod</th><th>Smjena danas</th><th>Aktivni nalozi</th><th>Na dužnosti</th><th>Posljednja aktivnost</th><th></th></tr></thead><tbody>' +
      ws.slice().sort((a, b) => a.name.localeCompare(b.name)).map(w => { const c = shiftToday(w), l = load(w.id);
        const duty = w.active === false ? '<span class="st" style="color:var(--tx4)">nalog ugašen</span>' : (w.guestUntil && Date.now() > w.guestUntil) ? '<span class="st" style="color:var(--tx4)">pristup istekao</span>'
          : onShift(w) ? '<span class="st s-done">na smjeni' + (gpsFresh(w) ? ' · na terenu' : '') + '</span>' : '<span class="st" style="color:var(--tx3)">van smjene</span>';
        return '<tr data-w="' + esc(w.id) + '"><td><b style="font-weight:500">' + esc(w.name) + '</b>' + (w.guest ? ' <span class="chip">izvođač' + (w.guestUntil ? ' do ' + new Date(w.guestUntil).toLocaleDateString('bs') : '') + '</span>' : '') + '</td>' +
          '<td class="mut">' + esc(svcName(w.dept)) + '</td><td class="mut">' + esc(w.role || '') + '</td><td class="mut">' + esc(w.code) + '</td>' +
          '<td class="mut">' + (c ? ({J:'jutarnja 07–15',P:'popodnevna 15–23',N:'noćna 23–07',O:'slobodan dan'})[c] : (w.shiftFrom ? esc(w.shiftFrom + '–' + w.shiftTo) : '—')) + '</td>' +
          '<td>' + (l || '<span class="mut">0</span>') + '</td><td>' + duty + '</td><td class="mut">' + (w.lastSeen ? ago(w.lastSeen) : 'još se nije prijavio') + '</td><td class="r"><button class="btn sm">Uredi</button></td></tr>'; }).join('') + '</tbody></table></div></div>';
    $('view').innerHTML = h;
    $('view').querySelectorAll('tr[data-w]').forEach(tr => tr.onclick = () => editWorker(tr.dataset.w));
    return;
  }
  if (tab === 'smjene') {
    const DAYS = ['Pon','Uto','Sri','Čet','Pet','Sub','Ned'], today = (new Date().getDay() + 6) % 7;
    h += '<div class="card"><div class="card-h"><h3>Sedmični raspored</h3><span class="sub">Klik na polje mijenja smjenu: J jutarnja 07–15 · P popodnevna 15–23 · N noćna 23–07 · – slobodno. Upisuje se odmah.</span></div><div class="card-b"><div class="shgrid">' +
      '<div></div>' + DAYS.map((d, i) => '<div class="h"' + (i === today ? ' style="color:var(--tx);font-weight:600"' : '') + '>' + d + '</div>').join('') +
      ws.map(w => { const sh = Array.isArray(w.shifts) && w.shifts.length === 7 ? w.shifts : ['J','J','J','J','J','O','O'];
        return '<div class="nm">' + esc(w.name) + '</div>' + sh.map((c, i) => '<button class="shc ' + c + '" data-w="' + esc(w.id) + '" data-d="' + i + '">' + (c === 'O' ? '–' : c) + '</button>').join(''); }).join('') +
      '<div class="nm" style="color:var(--tx3)">Na dužnosti</div>' + DAYS.map((d, i) => '<div class="h">' + ws.filter(w => { const sh = Array.isArray(w.shifts) && w.shifts.length === 7 ? w.shifts : ['J','J','J','J','J','O','O']; return sh[i] !== 'O' && w.active !== false; }).length + '</div>').join('') +
      '</div></div></div>';
    $('view').innerHTML = h;
    $('view').querySelectorAll('.shc').forEach(b => b.onclick = async () => {
      const w = workerById(b.dataset.w); const sh = (Array.isArray(w.shifts) && w.shifts.length === 7 ? w.shifts : ['J','J','J','J','J','O','O']).slice();
      const ord = ['J','P','N','O']; sh[+b.dataset.d] = ord[(ord.indexOf(sh[+b.dataset.d]) + 1) % 4];
      try { await api('/api/workers/' + w.id, { method: 'PATCH', body: { shifts: sh } }); w.shifts = sh; rerender(); } catch (e) { toast(e.message, 'err'); } });
    return;
  }
  const per = +(S.tab.radPer || 30), from = Date.now() - per * DAY;
  const perSel = '<select class="inp" style="width:auto" onchange="S.tab.radPer=this.value;rerender()">' + [[7,'7 dana'],[30,'30 dana'],[90,'90 dana'],[365,'12 mjeseci']].map(p =>
    '<option value="' + p[0] + '"' + (per === p[0] ? ' selected' : '') + '>' + p[1] + '</option>').join('') + '</select>';
  if (tab === 'ucinak') {
    const rows = ws.map(w => { const D = S.R.filter(r => r.status === 3 && r.worker === w.id && (r.resolvedAt || 0) > from);

      '</tbody></table></div></div><p style="color:var(--tx3);font-size:12.5px;margin-top:10px">Vrijeme rješavanja se mjeri od dodjele do stanja Riješeno. Poredano po imenu — ovo nije rang lista.</p>';

  const cnt = ws.map(w => ({ w, n: S.R.filter(r => (r.worker === w.id || (r.crew||[]).indexOf(w.id) >= 0) && (r.assignedAt || r.ts) > from).length }));
  const avg = cnt.reduce((a, x) => a + x.n, 0) / Math.max(1, cnt.length), mx = Math.max(1, ...cnt.map(x => x.n));
  h += '<div class="subnav"><span style="color:var(--tx3)">Period</span>' + perSel + '</div><div class="card"><div class="card-h"><h3>Dodijeljeni nalozi po radniku</h3><span class="sub">prosjek ' + d1(avg) + ' · linija označava prosjek</span></div><div class="card-b">' +
    cnt.sort((a, b) => a.w.name.localeCompare(b.w.name)).map(x => { const dev = avg ? (x.n - avg) / avg : 0;
      return '<div class="hbar"><span>' + esc(x.w.name) + '</span><span class="b" style="position:relative"><i style="width:' + (x.n / mx * 100) + '%;' + (Math.abs(dev) > .5 && avg >= 2 ? 'background:var(--amber)' : '') + '"></i>' +

  $('view').innerHTML = h;
};

/* jedna decimala sa zarezom, kako se piše kod nas */

   Grad se dijeli na polja od oko 1 km. Polje dobija ime po ulici koja se u

      (best == null ? van : Z[best]).R.push(r); });

      return { k: z.k, name: z.name, pop: z.pop, n: z.R.length, done: done.length, rate: z.R.length ? done.length / z.R.length : null, wait: avgOf(done.map(r => r.resolvedAt - r.ts)),
        open: z.R.filter(isOpen).length, over: z.R.filter(r => isOpen(r) && rok(r).k === 'over').length, inT: done.length ? done.filter(r => rok(r).inTime).length / done.length : null,

      open: z.R.filter(isOpen).length, over: z.R.filter(r => isOpen(r) && rok(r).k === 'over').length,

    setTimeout(() => { const draw = () => { $('pgL').innerHTML = '<table class="tbl static"><thead><tr><th>Naziv</th><th>Poena</th><th>Količina</th><th>Anonimno</th><th></th></tr></thead><tbody>' +
        L.map((p, i) => '<tr><td><input class="inp" data-pn="' + i + '" value="' + esc(p.naziv) + '"></td><td><input class="inp" type="number" data-pc="' + i + '" value="' + p.cijena + '" style="width:90px"></td>' +
          '<td><input class="inp" type="number" data-pk="' + i + '" value="' + p.kolicina + '" style="width:90px"></td><td><input type="checkbox" data-pa="' + i + '"' + (p.anonimno ? ' checked' : '') + ' style="width:18px;height:18px;accent-color:var(--green)"></td>' +
          '<td><button class="btn sm dng" data-px="' + i + '">Ukloni</button></td></tr>').join('') + '</tbody></table>';
        $('pgL').querySelectorAll('[data-px]').forEach(b => b.onclick = () => { sync(); L.splice(+b.dataset.px, 1); draw(); }); };
      const sync = () => L.forEach((p, i) => { p.naziv = document.querySelector('[data-pn="' + i + '"]').value; p.cijena = +document.querySelector('[data-pc="' + i + '"]').value;
        p.kolicina = +document.querySelector('[data-pk="' + i + '"]').value; p.anonimno = document.querySelector('[data-pa="' + i + '"]').checked; });
      $('pgAdd').onclick = () => { sync(); L.push({ naziv: '', cijena: 100, kolicina: 100, anonimno: true }); draw(); }; draw(); S._pgSync = sync; }, 0);
    save = () => { S._pgSync(); return { pogodnosti: L.filter(p => p.naziv.trim()) }; };
  }
  if (t === 'sadrzaj') {
    body = card('Politika sadržaja', 'Pravila su vidljiva građaninu na ekranu prijave. Automatska provjera i pregled dispečera rade protiv ove napisane procedure.',
      '<div class="fld"><textarea id="sP" style="min-height:140px">' + esc(P.sadrzaj.pravila) + '</textarea></div>', true);
    save = () => ({ sadrzaj: { pravila: $('sP').value } });
  }
  if (t === 'troskovi') {
    body = card('Troškovi', 'Prosječan trošak jednog izlaska ekipe i procjena trajnog zahvata, po službi. Koriste se za trošak odgađanja i kartu rizika. Sistem ne pretpostavlja iznose.',
      '<table class="tbl static"><thead><tr><th>Služba</th><th>Trošak izlaska (KM)</th><th>Trajni zahvat (KM)</th></tr></thead><tbody>' + P.sluzbe.map(s =>
        '<tr><td>' + esc(s.naziv) + '</td><td><input class="inp" type="number" data-ti="' + esc(s.id) + '" value="' + (P.trosakIzlaska[s.id] != null ? P.trosakIzlaska[s.id] : '') + '"></td>' +
        '<td><input class="inp" type="number" data-tz="' + esc(s.id) + '" value="' + (P.trosakZahvata[s.id] != null ? P.trosakZahvata[s.id] : '') + '"></td></tr>').join('') + '</tbody></table>', true);
    save = () => { const a = {}, b = {}; document.querySelectorAll('[data-ti]').forEach(x => { if (x.value !== '') a[x.dataset.ti] = +x.value; });
      document.querySelectorAll('[data-tz]').forEach(x => { if (x.value !== '') b[x.dataset.tz] = +x.value; }); return { trosakIzlaska: a, trosakZahvata: b }; };
  }
  if (t === 'izvodjaci') {
    const G = S.W.filter(w => w.guest);
    body = card('Vanjski izvođači', 'Gostujući pristup ograničen na naloge koji su mu dodijeljeni. Gasi se sam na upisani datum; nalozi ostaju u evidenciji.',
      (G.length ? '<table class="tbl"><thead><tr><th>Izvođač</th><th>Kod</th><th>Pristup do</th><th>Aktivni nalozi</th></tr></thead><tbody>' + G.map(w => '<tr data-w="' + esc(w.id) + '"><td>' + esc(w.name) + '</td><td class="mut">' + esc(w.code) + '</td><td>' +
        (w.guestUntil ? (Date.now() > w.guestUntil ? '<span style="color:var(--tx4)">isteklo ' : '') + new Date(w.guestUntil).toLocaleDateString('bs') + (Date.now() > w.guestUntil ? '</span>' : '') : '—') + '</td><td>' + load(w.id) + '</td></tr>').join('') + '</tbody></table>'
        : '<div class="empty" style="padding:16px">Nema vanjskih izvođača.</div>') + '<button class="btn pri" style="margin-top:14px" onclick="addWorker(true)">Dodaj izvođača</button>', false);
  }
  if (t === 'obavjestenja') {
    body = card('Obavještenja', 'Šta se broji u zvonu na platformi. Građanin dobija obavještenje pri svakoj promjeni stanja svoje prijave.',
      chk('oN', 'Nova prijava', P.obavjestenja.novaPrijava) + chk('oP', 'Nova poruka u razgovoru', P.obavjestenja.poruka) + chk('oR', 'Istekao rok naloga', P.obavjestenja.istekaoRok) + chk('oD', 'Radnik dobija obavještenje pri dodjeli', P.obavjestenja.dodjela) +
      '<h4 style="margin:18px 0 8px;font-size:13px;color:var(--tx3);font-weight:500">Mjesečni izvještaj</h4>' + txt('oI', 'Primaoci (e-pošta, odvojeno zarezom)', (P.izvjestaj || {}).primaoci) + txt('oT', 'Naslov izvještaja', (P.izvjestaj || {}).naslov) +
      '<div class="hint">Izvještaj za prošli mjesec je spreman 1. u mjesecu (zvono podsjeća prvih sedam dana). „Pošalji upravi" otvara e-poruku s ključnim brojevima za ove primaoce.</div>', true);
    save = () => ({ obavjestenja: { novaPrijava: $('oN').checked, poruka: $('oP').checked, istekaoRok: $('oR').checked, dodjela: $('oD').checked },
      izvjestaj: { primaoci: $('oI').value.trim(), naslov: $('oT').value.trim() || 'Mjesečni izvještaj o komunalnim prijavama' } });
  }
  if (t === 'zadrzavanje') {
    body = card('Zadržavanje podataka', 'Period čuvanja, odvojeno za arhivu naloga i evidenciju dokaza (fotografije, GPS, historija).',
      '<div class="frow">' + num('zA', 'Arhiva naloga (mjeseci)', P.zadrzavanje.arhivaMjeseci) + num('zD', 'Evidencija dokaza (mjeseci)', P.zadrzavanje.dokaziMjeseci, 'Za odštetne zahtjeve preporuka je najmanje 10 godina.') + '</div>', true);
    save = () => ({ zadrzavanje: { arhivaMjeseci: +$('zA').value, dokaziMjeseci: +$('zD').value } });
  }
  if (t === 'korisnici') {
    body = card('Korisnici platforme', '', '<p class="lead">Platforma trenutno ima <b>jednu zajedničku lozinku</b> za sve dispečere i nadzornike. Ime i uloga koje upišeš u Profilu (dolje lijevo) potpisuju tvoje izmjene u historiji naloga i u razgovorima.</p>' +
      '<p class="lead">Uloga nadzornika (vraćanje naloga na doradu) za sada se razlikuje samo u pregledniku. Zasebni računi s pravima po ulozi traže izmjenu prijave na serveru i dolaze kao poseban korak.</p>' +
      '<p class="lead">Prijava traje 12 sati i ostaje aktivna do odjave. Radnik gubi pristup odmah kad mu izdaš novi PIN ili ugasiš nalog.</p>' +
      '<button class="btn" onclick="editMe()">Promijeni svoje ime i ulogu</button>', false);
  }
  if (t === 'dnevnik') {
    const L = (P.log || []).slice().reverse();
    body = card('Dnevnik izmjena', 'Svaka izmjena postavki, s korisnikom i vremenom.', L.length ? '<table class="tbl static"><thead><tr><th>Vrijeme</th><th>Ko</th><th>Šta</th></tr></thead><tbody>' +
      L.map(x => '<tr><td class="mut">' + dateT(x.t) + '</td><td>' + esc(x.by) + '</td><td class="mut">' + esc(String(x.sta).split(', ').map(k => (SETS.find(s => s[0] === k) || [k, k === 'trosakIzlaska' || k === 'trosakZahvata' ? 'troškovi' : k === 'kategorije' ? 'kategorije' : k])[1]).join(', ')) + '</td></tr>').join('') + '</tbody></table>'
      : '<div class="empty" style="padding:16px">Postavke još nisu mijenjane — važe polazne vrijednosti.</div>', false);
  }
  const fb = S.Pfallback ? '<div class="note warn" style="margin-bottom:14px"><b>NE ČUVA SE</b><span>Server ne vraća postavke (' + esc((S.problems || []).join(' ') || 'nepoznat razlog') + '). Prikazane su polazne vrijednosti; izmjene se ne mogu sačuvati dok se ne objavi novi server.js.</span></div>' : '';
  $('view').innerHTML = '<div class="setgrid">' + nav + '<div>' + fb + body + '</div></div>';
  if (S.Pfallback) { const g0 = $('setGo'); if (g0) { g0.disabled = true; g0.title = 'Server ne podržava čuvanje postavki'; } }
  $('view').querySelectorAll('tr[data-w]').forEach(tr => tr.onclick = () => editWorker(tr.dataset.w));
  const g = $('setGo');
  if (g && save) g.onclick = async () => {
    let body; try { body = save(); } catch (e) { return ferr('setErr', e.message); }
    g.disabled = true;
    try { S.P = await api('/api/settings', { method: 'POST', body: Object.assign({ byName: meName() }, body) }); toast('Sačuvano i upisano u dnevnik.'); applySettings(); rerender(); }
    catch (e) { ferr('setErr', e.message); g.disabled = false; }
  };
};

/* ── PROFIL ── ime i uloga potpisuju izmjene i poruke */
function editMe(first){
  openModal(mHead(first ? 'Ko radi na ovom računaru?' : 'Profil', 'Ime se upisuje uz svaku tvoju izmjenu i poruku. Pamti se na ovom računaru.') + '<div class="m-b">' +
    '<div class="fld"><label for="meN">Ime i prezime</label><input id="meN" value="' + esc(ME.name) + '" placeholder="npr. Selma Begić"></div>' +
    '<div class="frow"><div class="fld"><label for="meR">Uloga</label><select id="meR"><option value="dispečer">Dispečer</option><option value="nadzornik"' + (ME.role === 'nadzornik' ? ' selected' : '') + '>Nadzornik</option></select></div>' +
    '<div class="fld"><label for="meS">Smjena</label><input id="meS" value="' + esc(ME.shift || '') + '" placeholder="07–15"></div></div>' +
    '<div class="hint">Nadzornik može vratiti riješen nalog na doradu.</div></div><div class="m-f">' + (first ? '<button class="btn" onclick="closeModal()">Kasnije</button>' : '<button class="btn" onclick="closeModal()">Odustani</button>') +
    '<button class="btn pri" id="meGo">Sačuvaj</button></div>');
  $('meGo').onclick = () => { ME.name = $('meN').value.trim(); ME.role = $('meR').value; ME.shift = $('meS').value.trim();
    localStorage.setItem('pinit_me', JSON.stringify(ME)); drawMe(); closeModal(); if (S.sel) openOrder(S.sel); };
}
function drawMe(){ $('meName').textContent = ME.name || 'Dispečer'; $('meRole').textContent = ME.role + (ME.shift ? ' · smjena ' + ME.shift : ''); }
$('meName').onclick = () => editMe();
function toggleLang(){ const en = (window.pinitJezik && window.pinitJezik() === 'en'); localStorage.setItem('pinit_lang', en ? 'bs' : 'en'); location.reload(); }
async function logout(){ try { await fetch('/api/admin/logout', { method: 'POST' }); } catch(e){} location.href = '/platforma'; }

/* ════════════════════════════════════════════════════════════════════
   PODACI — osvježavanje svakih 10 s; ekran se crta ponovo samo kad se
   nešto stvarno promijenilo, da dispečeru ne skače ekran ispod miša.
   ════════════════════════════════════════════════════════════════════ */
/* Polazne postavke (iste kao na serveru) — koriste se samo ako server ne
   vrati svoje, da Postavke i pravila rokova ne ostanu prazni. */
const POSTAVKE_POLAZNE = {
  institucija: { naziv: '', adresa: '', kontakt: '', grad: '', zaglavlje: 'Izvještaj o komunalnim prijavama' },
  sluzbe: [{ id: 'putevi', naziv: 'JKP Putevi', aktivna: true, zona: null }, { id: 'voda', naziv: 'JKP Vodovod', aktivna: true, zona: null },
    { id: 'elektro', naziv: 'JP Elektroprivreda', aktivna: true, zona: null }, { id: 'cistoca', naziv: 'JKP Čistoća', aktivna: true, zona: null }],
  kategorije: { putevi: 'putevi', predmet: 'putevi', staklo: 'putevi', ostalo: 'putevi', voda: 'voda', poplava: 'voda', rasveta: 'elektro', rasvjeta: 'elektro', elektro: 'elektro', otpad: 'cistoca' },
  rokovi: { staklo: 4, poplava: 12, voda: 24, predmet: 24, putevi: 72, otpad: 48, rasveta: 168, elektro: 168, ostalo: 72 },
  hitnost: { glasovaSrednje: 10, glasovaHitno: 25, hitnoPrepolovi: true, hitneKategorije: ['staklo'] },
  duplikati: { radiusM: 100, prozorDana: 30 }, razgovori: { autoOtvaranje: true, autoArhiviranje: true, prikaziOpterecenje: true },
  poeni: { ukljuceni: true, prijava: 10, potvrdaNaTerenu: 20, potvrdaTudje: 5, ocjena: 5, prvihPet: true },
  sadrzaj: { pravila: '' }, pogodnosti: [], obavjestenja: { novaPrijava: true, poruka: true, istekaoRok: true, dodjela: true },
  zadrzavanje: { arhivaMjeseci: 24, dokaziMjeseci: 120 }, trosakIzlaska: {}, trosakZahvata: {},
  drive: { prag: 50, sirinaM: 7, krpljenje: 12, presvlacenje: 38, rekonstrukcija: 95, budzet: 150000 }, log: []
};
let lastSig = '', pulling = null;
function applySettings(){
  $('instName').textContent = (S.P && S.P.institucija.naziv) || '';
  fillSvcSel();
}
function pull(force){
  if (pulling && !force) return pulling;
  /* Svaki izvor zasebno: ako jedan zakaže, ostali se ipak prikažu, a
     korisnik vidi koji je zakazao. Ranije je jedna ruta obarala sve. */
  const settle = p => p.then(v => ({ ok: true, v }), e => ({ ok: false, e }));
  pulling = Promise.all([settle(api('/api/reports')), settle(api('/api/workers')), S.P && !S.Pfallback ? Promise.resolve({ ok: true, v: S.P }) : settle(api('/api/settings'))]).then(([Rr, Wr, Pr]) => {
    if (!Rr.ok && !Wr.ok) throw Rr.e;
    const fails = [Rr, Wr, Pr].filter(x => !x.ok).map(x => x.e.message);
    S.problems = fails;
    showProblems();
    S.online = true;
    const firstP = !S.P;
    if (Pr.ok) { S.P = Pr.v; S.Pfallback = false; } else if (!S.P) { S.P = JSON.parse(JSON.stringify(POSTAVKE_POLAZNE)); S.Pfallback = true; }
    if (firstP || Pr.ok) applySettings();
    const R = Rr.ok ? Rr.v : S.R, W = Wr.ok ? Wr.v : S.W;
    const sig = JSON.stringify([R.map(r => [r.id, r.status, r.worker, r.votes, r.chatN, r.closedAt, r.addr, r.mergedInto, r.pri, r.photoOk, r.dept, (r.crew||[]).length, (r.participants||[]).length, r.cost, r.rating, r.recurConfirmed]),
      W.map(w => [w.id, w.name, w.active, w.locTs, w.dept, (w.shifts||[]).join(''), w.shiftFrom, w.shiftTo, w.guestUntil])]);
    S.R = R.slice().sort((a, b) => b.ts - a.ts); S.W = W;
    const was = S.loaded; S.loaded = true;
    refreshBadges();
    if (!was) go(location.hash.slice(1) || 'pregled');
    else if (sig !== lastSig || force) {
      /* Dok je otvoren modal ili fokus u polju, ne crtaj ponovo glavni ekran. */
      const busy = $('mbg').classList.contains('on') || /INPUT|TEXTAREA|SELECT/.test((document.activeElement || {}).tagName || '');
      if (!busy || force) rerender();
      if (S.sel && FULL && $('drawer').classList.contains('on')) { const r = S.R.find(x => x.id === S.sel); if (r) drawOrder(r, FULL); }
    }
    lastSig = sig;
  }).catch(e => {
    S.online = false;
    if (!S.loaded) $('view').innerHTML = '<div class="empty"><b>Server se ne javlja</b>' + esc(e.message) + '<br>Besplatni server se budi do 30 sekundi — pokušavam ponovo.</div>';
    else toast('Nema veze sa serverom — prikazani su posljednji podaci.', 'err');
  }).finally(() => { pulling = null; });
  return pulling;
}
/* ── Traka upozorenja na vrhu: stara verzija servera ili ruta koja ne radi ── */
const TREBA_SERVER = 42;
function showProblems(){
  let el = $('probBar');
  const msgs = [];
  if (S.srvOld) msgs.push('Server radi verziju <b>' + esc(S.srvVer) + '</b>, a ova platforma traži <b>v' + TREBA_SERVER + '</b> ili noviju. Objavi CIJELI paket (i <b>server.js</b>, ne samo folder public) pa osvježi stranicu. Do tada Postavke, Razgovori i dio statistike ne rade.');
  (S.problems || []).forEach(m => { if (msgs.join(' ').indexOf(m) < 0) msgs.push(esc(m)); });
  if (!msgs.length) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'probBar';
    el.style.cssText = 'background:rgba(240,87,75,.12);border-bottom:1px solid rgba(240,87,75,.55);color:#f3b3ad;font-size:13.5px;padding:10px 24px;line-height:1.5';
    const m = document.querySelector('.main'); m.insertBefore(el, m.children[1]); }
  el.innerHTML = msgs.map(x => '<div>' + x + '</div>').join('');
}
/* Rokovi teku i kad se podaci ne mijenjaju — svake minute osvježi prikaz roka. */
setInterval(() => { if (S.loaded && ['pregled','zadaci'].indexOf(S.view) >= 0 && !$('mbg').classList.contains('on')) rerender(); refreshBadges(); }, 60000);

(function init(){
  drawMe();
  $('langBtn').textContent = (window.pinitJezik && window.pinitJezik() === 'en') ? 'BS' : 'EN';
  fetch('/api/verzija').then(r => r.json()).then(j => {
    $('ver').textContent = 'Platforma 5.2 · server ' + j.verzija;
    const n = parseInt(String(j.verzija).replace(/\D/g, ''), 10);
    S.srvVer = j.verzija; S.srvOld = !isNaN(n) && n < TREBA_SERVER; showProblems();
  }).catch(() => {});
  /* Neuhvaćena greška bilo gdje: vidljiva poruka umjesto tihog kvara. */
  window.addEventListener('error', e => { if (e && e.message && !/ResizeObserver|Script error/.test(e.message)) toast('Greška na stranici: ' + e.message, 'err'); });
  window.addEventListener('unhandledrejection', e => { const m = e && e.reason && (e.reason.message || e.reason); if (m && !/Sesija je istekla/.test(m)) toast('Greška: ' + m, 'err'); });
  window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== S.view && S.loaded) go(v); });
  pull(true);
  setInterval(pull, 10000);
  if (!ME.name) setTimeout(() => { if (!$('mbg').classList.contains('on')) editMe(true); }, 900);
})();
</script>
</body>
</html>
